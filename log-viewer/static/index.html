<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zd-agent · 工单日志</title>
<style>
  :root{
    /* Dify official brand palette — primary #0033FF (from dify-design-kit) */
    --blue-600:#0033FF;   /* Dify 官方品牌色 */
    --blue-700:#0029CC;   /* hover 加深 */
    --blue-500:#3358FF;
    --blue-100:#CCD6FF;   /* soft border */
    --blue-50:#EBEFFF;    /* soft bg */
    --grad-a:#0033FF; --grad-b:#3358FF;

    --bg:#f9fafb; --panel:#ffffff;
    --ink:#101828; --ink-2:#344054; --muted:#667085; --faint:#98a2b3;
    --line:#eaecf0; --line-2:#f2f4f7; --hover:#f9fafb;
    --ok:#067647; --ok-weak:#ecfdf3; --ok-bd:#abefc6;
    --bad:#b42318; --bad-weak:#fef3f2; --bad-bd:#fecdca;
    --warn:#b54708; --warn-weak:#fffaeb; --warn-bd:#fedf89;
    --gray-weak:#f2f4f7; --gray-tx:#475467;
    --r:8px; --r-lg:12px; --r-xl:16px;
    --sh-xs:0 1px 2px rgba(16,24,40,.05);
    --sh-sm:0 1px 3px rgba(16,24,40,.1),0 1px 2px rgba(16,24,40,.06);
    --sh-md:0 4px 8px -2px rgba(16,24,40,.1),0 2px 4px -2px rgba(16,24,40,.06);
    --sbw:260px;
  }
  [data-theme="dark"]{
    --bg:#0d1117; --panel:#161b22;
    --ink:#e6edf3; --ink-2:#c9d1d9; --muted:#8b949e; --faint:#6e7681;
    --line:#21262d; --line-2:#1b2027; --hover:#1c2333;
    --blue-600:#5b82ff; --blue-700:#93b4ff; --blue-50:#172554; --blue-100:#1e3a8a;
    --ok:#3fb950; --ok-weak:#0f2a1c; --ok-bd:#1d4d33;
    --bad:#f85149; --bad-weak:#2c1614; --bad-bd:#5a261f;
    --warn:#d29922; --warn-weak:#2a1f0c; --warn-bd:#5a431a;
    --gray-weak:#21262d; --gray-tx:#c9d1d9;
    --sh-xs:0 1px 2px rgba(0,0,0,.4);
    --sh-sm:0 1px 3px rgba(0,0,0,.5);
    --sh-md:0 4px 12px rgba(0,0,0,.55);
  }
  [data-theme="dark"] .kpi.e .ic{background:#3a2a0e}
  [data-theme="dark"] .kpi.e .ic svg{stroke:#f0b85a}
  [data-theme="dark"] .kpi.e .val{color:#f0b85a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,system-ui,sans-serif;
       background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}
  .mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  svg{display:block;flex:none;stroke:currentColor}

  /* sidebar — white console, blue accents only */
  .sb{position:fixed;left:0;top:0;bottom:0;width:var(--sbw);z-index:40;background:var(--panel);
      border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 16px}
  .sb .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px;margin-bottom:6px;border-bottom:1px solid var(--line)}
  .sb .brand img{width:38px;height:38px;border-radius:10px;flex:none}
  .sb .brand .tx b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .sb .brand .tx span{font-size:12px;color:var(--faint)}
  .sb .grp{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:14px 10px 7px}
  .sb nav{display:flex;flex-direction:column;gap:2px}
  .sb a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r);
        color:var(--gray-tx);font-size:14px;font-weight:500;text-decoration:none;cursor:pointer;transition:background .15s,color .15s}
  .sb a svg{width:19px;height:19px;stroke:var(--muted);transition:stroke .15s}
  .sb a:hover{background:var(--hover);color:var(--ink)}
  .sb a.on{background:var(--blue-50);color:var(--blue-700)}
  .sb a.on svg{stroke:var(--blue-600)}
  .sb a .badge{margin-left:auto;font-size:12px;background:var(--gray-weak);color:var(--gray-tx);border-radius:20px;padding:1px 9px;font-weight:600}
  .sb a.on .badge{background:var(--blue-100);color:var(--blue-700)}
  .sb .foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
  .sb .who{display:flex;align-items:center;gap:10px;padding:6px}
  .sb .who .av{width:32px;height:32px;border-radius:50%;background:var(--blue-50);color:var(--blue-700);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
  .sb .who .nm{font-size:13px;font-weight:600;color:var(--ink-2)} .sb .who .nm small{display:block;font-size:11px;color:var(--faint);font-weight:400}

  .main{margin-left:var(--sbw);min-height:100vh}
  .topbar{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;gap:14px;padding:0 32px;
    background:rgba(249,250,251,.85);backdrop-filter:saturate(180%) blur(8px);-webkit-backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--line)}
  .topbar h1{font-size:18px;font-weight:700;letter-spacing:-.01em} .topbar .crumb{color:var(--faint);font-weight:400}
  .grow{flex:1}
  .search{display:flex;align-items:center;gap:8px;height:40px;width:300px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);padding:0 12px;box-shadow:var(--sh-xs);transition:border-color .15s,box-shadow .15s}
  .search:focus-within{border-color:var(--blue-600);box-shadow:0 0 0 4px var(--blue-50)}
  .search svg{stroke:var(--faint)} .search input{border:0;outline:0;flex:1;background:transparent;font-size:14px;color:var(--ink);font-family:inherit}
  .btn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 15px;border:1px solid var(--line);background:var(--panel);
    border-radius:var(--r);font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;box-shadow:var(--sh-xs);transition:.15s;font-family:inherit}
  .btn:hover{background:var(--hover)}
  .btn-pri{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
  .btn-pri:hover{background:var(--blue-700)}
  /* footer action buttons (设置 / 退出) */
  .sb .who .fact{margin-left:auto;display:flex;gap:3px}
  .fbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);
        display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:.15s;padding:0}
  .fbtn:hover{background:var(--hover);color:var(--ink);border-color:var(--blue-100)}
  .fbtn svg{width:16px;height:16px;stroke:currentColor}
  /* settings modal */
  .modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
         background:rgba(16,24,40,.5);backdrop-filter:blur(2px)}
  .modal.show{display:flex}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);width:430px;max-width:calc(100vw - 32px);
         box-shadow:var(--sh-md);overflow:hidden;animation:pop .18s ease}
  @keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .sheet-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
  .sheet-h b{font-size:16px;font-weight:650;color:var(--ink)}
  .sheet-x{cursor:pointer;color:var(--faint);width:28px;height:28px;border-radius:7px;border:none;background:none;
           display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1}
  .sheet-x:hover{background:var(--hover);color:var(--ink)}
  .sheet-b{padding:4px 20px 16px}
  .sgrp{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:16px 0 4px}
  .srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)}
  .srow:last-child{border-bottom:none}
  .srow .lk{font-size:14px;color:var(--ink-2);font-weight:500}
  .srow .rk{font-size:13px;color:var(--muted);font-weight:500}
  .sw{width:42px;height:24px;border-radius:13px;background:var(--gray-weak);border:none;cursor:pointer;position:relative;transition:.18s;flex:none}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:.18s}
  .sw.on{background:var(--blue-600)} .sw.on::after{left:20px}
  .seg{display:flex;gap:4px}
  .seg button{font-size:12px;padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;font-weight:600;transition:.12s}
  .seg button.on{background:var(--blue-50);border-color:var(--blue-100);color:var(--blue-700)}
  .sheet-f{padding:14px 20px;border-top:1px solid var(--line)}
  .logout{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:var(--r);
          border:1px solid var(--bad-bd);background:var(--bad-weak);color:var(--bad);font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
  .logout:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
  .logout svg{width:16px;height:16px;stroke:currentColor}
  .body{padding:28px 32px 56px;max-width:1320px}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;margin-bottom:26px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-xs);transition:box-shadow .18s,transform .18s}
  .kpi:hover{box-shadow:var(--sh-md);transform:translateY(-2px)}
  .kpi .top{display:flex;align-items:center;justify-content:space-between}
  .kpi .lab{font-size:13px;color:var(--muted);font-weight:500}
  .kpi .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .kpi.a{background:linear-gradient(135deg,#0033FF,#1F4DFF);border-color:#0033FF}
  .kpi.a .lab{color:rgba(255,255,255,.85)} .kpi.a .val{color:#fff}
  .kpi.a .ic{background:rgba(255,255,255,.2)} .kpi.a .ic svg{stroke:#fff}
  .kpi.b .ic{background:var(--ok-weak)} .kpi.b .ic svg{stroke:var(--ok)}
  .kpi.c .ic{background:var(--bad-weak)} .kpi.c .ic svg{stroke:var(--bad)}
  .kpi.d .ic{background:var(--blue-50)} .kpi.d .ic svg{stroke:var(--blue-600)}
  .kpi.e .ic{background:#fff4e5} .kpi.e .ic svg{stroke:#c2770b}
  .kpi .val{font-size:30px;font-weight:720;letter-spacing:-.02em;margin-top:14px;line-height:1}
  .kpi.b .val{color:var(--ok)} .kpi.c .val{color:var(--bad)} .kpi.d .val{color:var(--blue-600)} .kpi.e .val{color:#c2770b}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-xs);overflow:hidden}
  .card-h{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line-2)}
  .card-h .t{font-size:16px;font-weight:650} .card-h .n{font-size:12px;color:var(--blue-700);background:var(--blue-50);border-radius:20px;padding:2px 10px;font-weight:600}
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:880px}
  thead th{background:#fbfcfe;font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:12px 22px;border-bottom:1px solid var(--line);white-space:nowrap}
  thead th.r,tbody td.r{text-align:right}
  tbody td{padding:15px 22px;border-bottom:1px solid var(--line-2);font-size:14px;vertical-align:middle;white-space:nowrap}
  tbody tr{cursor:pointer;transition:background .12s} tbody tr:hover{background:var(--hover)} tbody tr:last-child td{border-bottom:0}
  .tid{font-weight:700;color:var(--blue-700)} .tid .h{color:var(--faint);font-weight:600}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  .pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:16px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
  .pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
  .p-ok{background:var(--ok-weak);color:var(--ok);border-color:var(--ok-bd)}
  .p-bad{background:var(--bad-weak);color:var(--bad);border-color:var(--bad-bd)}
  .p-warn{background:var(--warn-weak);color:var(--warn);border-color:var(--warn-bd)}
  .p-run{background:var(--gray-weak);color:var(--gray-tx)}
  .tag{display:inline-block;height:24px;line-height:22px;padding:0 9px;border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--ink-2);font-weight:500;background:var(--panel)}
  .tok.hot{color:var(--bad);font-weight:700}
  .ck svg{stroke:var(--ok)} .ck.no svg{stroke:var(--faint)}

  .sk{background:linear-gradient(90deg,#eef0f4 25%,#f6f7fa 37%,#eef0f4 63%);background-size:400% 100%;animation:sh 1.3s ease infinite;border-radius:6px}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
  .empty{padding:72px 20px;text-align:center;color:var(--muted)}
  .empty svg{stroke:var(--faint);margin:0 auto 14px} .empty .t{font-weight:600;color:var(--ink-2);font-size:15px} .empty .s{font-size:13px;margin-top:4px}

  .back{display:inline-flex;align-items:center;gap:6px;color:var(--blue-600);cursor:pointer;font-size:14px;font-weight:600;margin-bottom:20px;user-select:none}
  .back:hover{color:var(--blue-700)}
  .dh{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-xs);margin-bottom:24px;overflow:hidden}
  .dh .r1{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:22px 26px 20px}
  .dh h2{font-size:24px;font-weight:720;letter-spacing:-.01em}
  .dh .grid{display:flex;border-top:1px solid var(--line-2);background:var(--hover)}
  .dh .m{flex:1;padding:16px 26px;border-right:1px solid var(--line-2)} .dh .m:last-child{border-right:0}
  .dh .m .k{font-size:12px;color:var(--muted)} .dh .m .v{font-size:20px;font-weight:700;margin-top:3px;letter-spacing:-.01em}

  .review{display:grid;gap:18px;margin-bottom:26px}
  .review-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-xs);overflow:hidden}
  .review-card .rh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
  .review-card .rh b{font-size:15px;font-weight:680}
  .review-card .rh span{font-size:12px;color:var(--faint)}
  .review-card .rb{padding:18px 20px}
  .archive-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .archive-sec{border:1px solid var(--line-2);border-radius:var(--r);padding:14px;background:var(--hover);min-width:0}
  .archive-sec.wide{grid-column:1/-1}
  .archive-sec .st{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .archive-sec .st b{font-size:13px;color:var(--ink-2)}
  .archive-sec .st .tag{height:20px;line-height:18px;font-size:11px;padding:0 7px;background:var(--panel)}
  .archive-sec .txt{white-space:pre-wrap;color:var(--ink-2);font-size:13px;line-height:1.7;overflow-wrap:anywhere}
  .evidence{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .evi{border:1px solid var(--line-2);border-radius:var(--r);padding:14px;background:var(--panel);min-width:0}
  .evi h3{font-size:13px;color:var(--ink-2);font-weight:680;margin-bottom:9px}
  .evi .line{display:flex;gap:8px;margin-top:5px;color:var(--ink-2);font-size:13px}
  .evi .line b{color:var(--muted);font-weight:600;min-width:58px}
  .evi .reason{margin-top:8px;color:var(--ink-2);font-size:13px;line-height:1.65;white-space:pre-wrap}
  .mini-list{display:grid;gap:8px}
  .mini{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:8px 10px;border-radius:7px;background:var(--hover);font-size:13px;color:var(--ink-2)}
  .timeline-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 16px}
  .timeline-head h2{font-size:16px;font-weight:680}
  .timeline-head span{font-size:12px;color:var(--faint)}

  .tl{position:relative;margin-left:9px;padding-left:30px;border-left:2px solid var(--line)}
  .ev{position:relative;padding-bottom:20px} .ev:last-child{padding-bottom:2px}
  .ev .node{position:absolute;left:-40px;top:9px;width:20px;height:20px;border-radius:50%;background:var(--panel);border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
  .ev .node svg{width:11px;height:11px;stroke:var(--muted)}
  /* 噪音事件：紧凑灰色小行 */
  .ev.noise{padding-bottom:8px}
  .ev.noise .node{width:12px;height:12px;left:-36px;top:5px;border-color:var(--line-2);background:#fafbfc}
  .ev.noise .node svg{width:7px;height:7px;stroke:var(--faint)}
  .ev.noise .bd{background:transparent;border:0;box-shadow:none;padding:3px 0 3px 4px}
  .ev.noise .bd:hover{background:transparent;box-shadow:none}
  .ev.noise .name{font-weight:400;font-size:12.5px;color:var(--faint)}
  .ev.noise .t{font-size:11px}
  .ev.noise .fields{margin-top:2px;color:var(--faint);font-size:11.5px} .ev.noise .kv b{color:var(--faint)}
  .ev.noise .exp{display:none}
  .ev.err .node{border-color:var(--bad);background:var(--bad-weak)} .ev.err .node svg{stroke:var(--bad)}
  .ev.ok .node{border-color:var(--ok);background:var(--ok-weak)} .ev.ok .node svg{stroke:var(--ok)}
  .ev.reply .node{border-color:var(--blue-600);background:var(--blue-50)} .ev.reply .node svg{stroke:var(--blue-600)}
  .ev .bd{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 16px;box-shadow:var(--sh-xs);cursor:pointer;transition:border-color .14s,box-shadow .14s}
  .ev .bd:hover{border-color:var(--blue-100);box-shadow:var(--sh-md)} .ev.err .bd{border-color:var(--bad-bd);background:#fffcfc}
  .ev .l1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .ev .name{font-weight:650;font-size:14px} .ev.err .name{color:var(--bad)}
  .ev .t{font-size:12px;color:var(--faint);font-family:ui-monospace,monospace;margin-left:auto}
  .ev .fields{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px 18px;font-size:13px}
  .ev .kv{color:var(--ink-2);font-family:ui-monospace,monospace} .ev .kv b{color:var(--muted);font-weight:600}
  .toolchip{display:inline-block;background:var(--blue-50);color:var(--blue-700);border:1px solid var(--blue-100);border-radius:6px;padding:1px 8px;margin-right:5px;font-size:12px;font-weight:600;font-family:ui-monospace,monospace}
  .ev .exp{font-size:12px;color:var(--faint);margin-top:9px;cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:4px}
  .ev .exp:hover{color:var(--blue-600)}
  .ev pre{display:none;margin-top:11px;padding:14px;background:#0c111d;color:#cdd6f4;border-radius:var(--r);font-size:12px;line-height:1.65;overflow:auto;max-height:360px;font-family:ui-monospace,monospace}
  .ev.open pre{display:block}

  .burger{display:none} .scrim{display:none}
  @media(max-width:880px){
    .sb{transform:translateX(-100%);transition:transform .22s} body.nav-open .sb{transform:none}
    .main{margin-left:0} .burger{display:inline-flex}
    body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:39}
    .kpis{grid-template-columns:repeat(2,1fr)} .body{padding:18px} .topbar{padding:0 16px} .search{width:150px}
    .archive-grid,.evidence{grid-template-columns:1fr}
    .dh .grid{display:grid;grid-template-columns:repeat(2,1fr)}
    .dh .m{border-right:0;border-bottom:1px solid var(--line-2)}
  }
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
  <aside class="sb">
    <div class="brand">
      <img src="dify-avatar.svg" alt="Dify" onerror="this.style.display='none'">
      <span class="tx"><b>zd-agent</b><span>Dify SaaS Support</span></span>
    </div>
    <div class="grp">监控</div>
    <nav>

<script>

};
const EV={ticket_classified:"tag",trigger_verdict:"target",round_tool_calls:"tool",public_reply_sent:"msg",public_reply_send_start:"msg",internal_reply_auto_public_sent:"msg",compaction_triggered:"arch",agent_done:"done",agent_start:"play",ack_note_sent:"note",sandbox_created:"box",trigger_enter_silence:"clock"};
// 事件名中英映射（关键 + 常见噪音）
const EVENT_CN={
  trigger_verdict:"触发判定", ticket_classified:"工单分类", round_tool_calls:"工具调用",
  public_reply_sent:"已发公开回复", public_reply_send_start:"开始发公开回复",

  agent_done:"处理完成", agent_start:"开始处理", ack_note_sent:"已发确认备注",
  sandbox_created:"创建沙箱", trigger_enter_silence:"进入静默窗口",
  trigger_fetch_messages_ok:"拉取消息", zendesk_messaging_webhook_skip_non_user:"跳过非客户消息",
  trigger_dispatch_direct:"直接派发", silence_expired_dispatch:"静默到期派发",
  session_dispatched:"会话已派发", session_finished:"会话结束",
  trigger_skip_duplicate_comment:"跳过重复评论", trigger_skip_post_agent_cooldown_direct:"冷却期跳过",
};
function evName(e){return EVENT_CN[e]||e;}
const isErr=e=>/timeout|failed|error|escalat/i.test(e), isDone=e=>e==="agent_done", isReply=e=>/reply/.test(e);
// 噪音事件：webhook 跳过 / 拉消息 / 派发心跳 等内部 routine，淡化显示
const NOISE=new Set(["zendesk_messaging_webhook_skip_non_user","trigger_fetch_messages_ok","trigger_skip_duplicate_comment","trigger_skip_post_agent_cooldown_direct","session_dispatched","trigger_dispatch_direct","silence_expired_dispatch"]);
function isNoise(e){return NOISE.has(e);}
// 时间线上不值得展示的字段（UUID/内部 id），收进原始 JSON 即可
const HIDE_FIELDS=new Set(["event","timestamp","level","module","ticket_id","event_id","msg_id","comment_id","session_id","actor_type"]);
function evIcon(e){return isErr(e)?ic(I.alert,11):ic(I[EV[e]||"dot"],11);}
function fmtTime(t){return t?t.replace("T"," ").replace("Z","").slice(5,19):"";}
function fmtTok(n){if(n==null||n==="")return"—";const v=typeof n==="number"?n:parseFloat(String(n).replace(/[^\d.]/g,""));if(!isFinite(v))return String(n);return v>=1000?(v/1000).toFixed(0)+"K":""+v;}
function fmtEl(s){if(s==null||s==="")return"—";const v=typeof s==="number"?s:parseFloat(String(s).replace(/[^\d.]/g,""));if(!isFinite(v))return String(s);return v>=60?(v/60).toFixed(1)+"m":v.toFixed(0)+"s";}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
// 枚举中英映射（与 agent 源码一致）
const VERDICT_CN={no_message:"无消息",greeting:"打招呼",insufficient_info:"信息不足",substantial_issue:"实质问题",request_human:"请求人工",self_resolved:"已自行解决"};
const TYPE_CN={platform_issue:"平台故障",knowledge_base:"知识库",workflow:"工作流",api:"API",permissions:"权限",product_usage:"产品用法",billing:"计费",refund:"退款",insufficient_info:"信息不足",mention:"@提及",general:"通用"};
const TRIGGER_CN={zendesk_webhook:"客户消息",silence_waker:"静默唤醒",native_messaging:"消息渠道",mention:"@提及",mention_poller:"@提及",web:"网页",api:"API"};
const STATUS_CN={completed:"已完成",failed:"失败",processing:"处理中",processed:"已处理",skipped:"已跳过"};
function cn(map,v){return v?(map[v]||v):v;}
function stp(s){if(!s)return `<span class="pill p-run"><span class="d"></span>处理中</span>`;if(s==="completed")return `<span class="pill p-ok"><span class="d"></span>已完成</span>`;if(s==="failed")return `<span class="pill p-bad"><span class="d"></span>失败</span>`;return `<span class="pill p-warn"><span class="d"></span>${esc(cn(STATUS_CN,s))}</span>`;}
function vtag(v){return v?`<span class="tag" title="${esc(v)}">${esc(cn(VERDICT_CN,v))}</span>`:'<span class="faint">—</span>';}
function ttag(v){return v?`<span class="tag" title="${esc(v)}">${esc(cn(TYPE_CN,v))}</span>`:'<span class="faint">—</span>';}
function mtags(models,fallback){const a=Array.isArray(models)&&models.length?models:(fallback?[fallback]:[]);return a.length?a.map(m=>`<span class="toolchip">${esc(m)}</span>`).join(""):'<span class="faint">—</span>';}

let CACHE=[];
function goList(){document.body.classList.remove('nav-open');location.hash='';}

async function showList(silent){
  if(location.hash){location.hash='';return;}
  document.getElementById('crumb').textContent='';
  const app=document.getElementById('app'); if(!silent)app.innerHTML=skeleton();
  let rows; try{rows=await(await fetch('api/tickets')).json();}catch(e){app.innerHTML=empty('加载失败',String(e));return;}
  CACHE=rows; document.getElementById('q').disabled=false;
  document.getElementById('navCount').textContent=rows.length;
  const total=rows.length,done=rows.filter(r=>r.status==="completed").length,
    failed=rows.filter(r=>r.status==="failed").length,
    wr=rows.filter(r=>r.rounds!=null),avg=wr.length?Math.round(wr.reduce((a,r)=>a+r.rounds,0)/wr.length):"—",
    sumTok=rows.reduce((a,r)=>a+(parseFloat(String(r.total_tokens??0).replace(/[^\d.]/g,""))||0),0);
  let h=`<div class="kpis">
    ${kpi('a','layers','总工单',total)}
    ${kpi('b','check2','已完成',done)}
    ${kpi('c','xcirc','失败',failed)}
    ${kpi('d','loop','平均轮数',avg)}
    ${kpi('e','coins','总token',fmtTok(sumTok))}
  </div>
  <div class="card"><div class="card-h"><span class="t">处理记录</span><span class="n">${total}</span></div>
    <div class="tw"><table><thead><tr>
      <th>工单</th><th>状态</th><th>判定</th><th>类型</th>
      <th class="r">轮数</th><th class="r">token</th><th class="r">耗时</th><th>模型</th><th>触发</th><th>回复</th><th>最后时间</th>
    </tr></thead><tbody id="tb">`;
  if(!total)h+=`<tr><td colspan="11">${empty('暂无日志','agent 处理工单后自动出现')}</td></tr>`;
  for(const s of rows){
    const hot=s.total_tokens&&parseFloat(String(s.total_tokens).replace(/[^\d.]/g,""))>1000000?"hot":"";
    const rep=s.reply_sent===true?`<span class="ck">${ic(I.check,17)}</span>`:`<span class="ck no">${ic(I.x,16)}</span>`;
    h+=`<tr data-id="${s.ticket_id}" onclick="go(${s.ticket_id})">
      <td class="tid"><span class="h">#</span>${s.ticket_id}</td>
      <td>${stp(s.status)}</td><td>${vtag(s.verdict)}</td>
      <td>${ttag(s.ticket_type)}</td>
      <td class="r num">${s.rounds??'<span class="faint">—</span>'}</td>
      <td class="r num tok ${hot}">${fmtTok(s.total_tokens)}</td>
      <td class="r num muted">${fmtEl(s.elapsed)}</td>
      <td>${mtags(s.models,s.model)}</td>
      <td>${s.trigger?esc(TRIGGER_CN[s.trigger]||s.trigger):'<span class="faint">—</span>'}</td>
      <td>${rep}</td><td class="mono faint">${fmtTime(s.last_time)}</td>
    </tr>`;
  }
  h+=`</tbody></table></div></div>`; app.innerHTML=h;
}
function kpi(c,i,l,v){return `<div class="kpi ${c}"><div class="top"><span class="lab">${l}</span><span class="ic">${ic(I[i],20)}</span></div><div class="val num">${v}</div></div>`;}
function skeleton(){let r="";for(let i=0;i<6;i++)r+=`<tr><td colspan="11"><div class="sk" style="height:20px"></div></td></tr>`;
  return `<div class="kpis">${[0,0,0,0,0].map(()=>`<div class="kpi"><div class="top"><div class="sk" style="height:13px;width:50px"></div><div class="sk" style="width:40px;height:40px;border-radius:10px"></div></div><div class="sk" style="height:30px;width:66px;margin-top:14px"></div></div>`).join("")}</div><div class="card"><div class="card-h"><div class="sk" style="height:16px;width:90px"></div></div><div class="tw"><table><tbody>${r}</tbody></table></div></div>`;}
function empty(t,s){return `<div class="empty">${ic(I.inbox,42,1.5)}<div class="t">${esc(t)}</div><div class="s">${esc(s||"")}</div></div>`;}
function filter(){const q=document.getElementById('q').value.trim();document.querySelectorAll('#tb tr').forEach(tr=>{const id=tr.getAttribute('data-id')||"";tr.style.display=!q||id.includes(q)?"":"none";});}
function go(id){location.hash="t/"+id;}

const ARCHIVE_LABELS={internal_analysis:"内部分析",solution:"解决方案 / 建议",customer_reply_draft:"客户回复草稿",follow_up:"跟进记录",other:"其他章节"};
const ARCHIVE_ORDER=["internal_analysis","solution","customer_reply_draft","follow_up","other"];
function txt(s){return esc(s||"").trim();}
function secLabel(s){return ARCHIVE_LABELS[s.category]||ARCHIVE_LABELS.other;}
function archiveSections(archive){
  if(!archive||!archive.available)return `<div class="empty" style="padding:34px 20px">${ic(I.inbox,32,1.5)}<div class="t">暂无归档</div><div class="s">没有找到该工单的 Markdown 复盘文件</div></div>`;
  const sections=archive.sections||[];
  if(!sections.length)return `<div class="empty" style="padding:34px 20px">${ic(I.inbox,32,1.5)}<div class="t">归档为空</div><div class="s">${esc(archive.filename||"")}</div></div>`;
  const sorted=[...sections].sort((a,b)=>{
    const ai=ARCHIVE_ORDER.indexOf(a.category),bi=ARCHIVE_ORDER.indexOf(b.category);
    return (ai<0?99:ai)-(bi<0?99:bi);
  });
  return `<div class="archive-grid">`+sorted.map(s=>{
    const wide=s.category==="customer_reply_draft"||s.category==="follow_up"||String(s.content||"").length>360;
    return `<section class="archive-sec ${wide?'wide':''}">
      <div class="st"><b>${esc(s.title||secLabel(s))}</b><span class="tag">${esc(secLabel(s))}</span></div>
      <div class="txt">${txt(s.content)||'<span class="faint">空章节</span>'}</div>
    </section>`;
  }).join("")+`</div>`;
}
function line(label,value){return `<div class="line"><b>${esc(label)}</b><span>${value==null||value===""?'<span class="faint">—</span>':esc(value)}</span></div>`;}
function evidence(review){
  const h=(review&&review.highlights)||{},v=h.trigger_verdict||{},c=h.classification||{},done=h.completion||{};
  const tools=h.tool_rounds||[],replies=h.reply_events||[];
  const toolHtml=tools.length?`<div class="mini-list">`+tools.map(r=>`<div class="mini"><span class="mono">#${esc(r.round??'—')}</span><span class="faint">${fmtTime(r.timestamp)}</span>${(r.tool_names||[]).map(t=>`<span class="toolchip">${esc(t)}</span>`).join("")}<span class="faint">${esc(r.tool_call_count??0)} 次调用</span></div>`).join("")+`</div>`:`<span class="faint">—</span>`;
  const replyHtml=replies.length?`<div class="mini-list">`+replies.map(r=>`<div class="mini"><span>${esc(evName(r.event||"reply"))}</span><span class="faint">${fmtTime(r.timestamp)}</span>${r.comment_id?`<span class="mono">comment ${esc(r.comment_id)}</span>`:""}</div>`).join("")+`</div>`:`<span class="faint">—</span>`;
  return `<div class="evidence">
    <section class="evi"><h3>触发判定</h3>${line("判定",cn(VERDICT_CN,v.verdict)||v.verdict)}${line("完整度",v.completeness)}${v.reason?`<div class="reason">${txt(v.reason)}</div>`:""}</section>
    <section class="evi"><h3>分类理由</h3>${line("类型",cn(TYPE_CN,c.ticket_type)||c.ticket_type)}${c.reason?`<div class="reason">${txt(c.reason)}</div>`:""}</section>
    <section class="evi"><h3>工具调用轮次</h3>${toolHtml}</section>
    <section class="evi"><h3>回复与完成</h3>${replyHtml}${line("状态",cn(STATUS_CN,done.status)||done.status)}${line("轮数",done.rounds)}${line("Token",fmtTok(done.total_tokens))}${line("耗时",fmtEl(done.elapsed))}${line("已回复",done.reply_sent===true?"是":done.reply_sent===false?"否":"")}</section>
  </div>`;
}

async function showDetail(id){
  document.getElementById('crumb').textContent="/ #"+id; document.getElementById('q').disabled=true;
  const app=document.getElementById('app');
  app.innerHTML=`<div class="sk" style="height:118px;border-radius:12px;margin-bottom:24px"></div>`+[0,0,0,0].map(()=>`<div class="sk" style="height:58px;border-radius:12px;margin:0 0 20px 38px"></div>`).join("");
  let tl,review;try{
    const [tr,rr]=await Promise.all([fetch('api/tickets/'+id),fetch('api/tickets/'+id+'/review')]);
    if(!tr.ok)throw new Error(await tr.text());
    if(!rr.ok)throw new Error(await rr.text());
    tl=await tr.json();review=await rr.json();
  }catch(e){app.innerHTML=empty('加载失败',String(e));return;}
  const sum=(review&&review.summary)||CACHE.find(r=>r.ticket_id===id)||{};
  let h=`<div class="back" onclick="location.hash=''">${ic(I.chev,17)}返回列表</div>
    <div class="dh"><div class="r1"><h2><span class="faint" style="font-weight:600">#</span>${id}</h2>${stp(sum.status)}${vtag(sum.verdict)}</div>
    <div class="grid">
      <div class="m"><div class="k">事件</div><div class="v num">${tl.length}</div></div>
      <div class="m"><div class="k">轮数</div><div class="v num">${sum.rounds??'—'}</div></div>
      <div class="m"><div class="k">Token</div><div class="v num">${fmtTok(sum.total_tokens)}</div></div>
      <div class="m"><div class="k">耗时</div><div class="v num">${fmtEl(sum.elapsed)}</div></div>
      <div class="m"><div class="k">类型</div><div class="v" style="font-size:15px" title="${esc(sum.ticket_type||'')}">${sum.ticket_type?cn(TYPE_CN,sum.ticket_type):'—'}</div></div>
    </div></div>
    <div class="review">
      <section class="review-card"><div class="rh"><b>复盘摘要</b><span>${review.archive&&review.archive.available?esc(review.archive.filename||"已加载归档"):"未找到归档"}</span></div><div class="rb">${archiveSections(review.archive)}</div></section>
      <section class="review-card"><div class="rh"><b>关键证据</b><span>来自 JSONL 事件链</span></div><div class="rb">${evidence(review)}</div></section>
    </div>
    <div class="timeline-head"><h2>完整时间线</h2><span>点击事件展开原始 JSON</span></div>
    <div class="tl">`;
  if(!tl.length)h+=empty('无事件','');
  for(const e of tl){
    const ev=e.event||"";
    const noise=isNoise(ev);
    const cls=isErr(ev)?"err":isDone(ev)?"ok":isReply(ev)?"reply":(noise?"noise":"");
    let f="";for(const[k,v] of Object.entries(e)){if(HIDE_FIELDS.has(k))continue;
      if(k==="tool_names"&&Array.isArray(v))f+=`<span class="kv"><b>tools</b> `+v.map(t=>`<span class="toolchip">${esc(t)}</span>`).join("")+`</span>`;
      else{let val=typeof v==="object"?JSON.stringify(v):String(v);if(val.length>72)val=val.slice(0,72)+"…";f+=`<span class="kv"><b>${esc(k)}</b> ${esc(val)}</span>`;}}
    h+=`<div class="ev ${cls}"><span class="node">${evIcon(ev)}</span><div class="bd" onclick="this.classList.toggle('open')">
      <div class="l1"><span class="name" title="${esc(ev)}">${esc(evName(ev))}</span><span class="t">${fmtTime(e.timestamp)}</span></div>
      ${f?`<div class="fields">${f}</div>`:""}${noise?"":`<div class="exp">${ic(I.chev,12)} 原始 JSON</div>`}
      <pre>${esc(JSON.stringify(e,null,2))}</pre></div></div>`;
  }
  h+=`</div>`; app.innerHTML=h;
}
// ───── 设置：深色模式 + 自动刷新 + 退出登录 ─────
const LS={theme:'zdv_theme',auto:'zdv_auto',int:'zdv_int'};
let autoTimer=null;
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);const b=document.getElementById('swTheme');if(b)b.classList.toggle('on',t==='dark');}
function toggleTheme(){const cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';localStorage.setItem(LS.theme,cur);applyTheme(cur);}
function curInt(){return parseInt(localStorage.getItem(LS.int)||'30',10);}
function autoOn(){return localStorage.getItem(LS.auto)==='1';}
function renderSeg(){const sel=curInt();const el=document.getElementById('segInt');if(el)el.innerHTML=[15,30,60].map(s=>`<button class="${s===sel?'on':''}" onclick="setInt(${s})">${s}s</button>`).join('');}
function setInt(s){localStorage.setItem(LS.int,s);renderSeg();startAuto();}
function startAuto(){if(autoTimer){clearInterval(autoTimer);autoTimer=null;}if(autoOn())autoTimer=setInterval(()=>{if(!location.hash)showList(true);},curInt()*1000);}
function toggleAuto(){localStorage.setItem(LS.auto,autoOn()?'0':'1');const b=document.getElementById('swAuto');if(b)b.classList.toggle('on',autoOn());startAuto();}
function openSettings(){document.body.classList.remove('nav-open');renderSeg();
  const t=document.getElementById('swTheme');if(t)t.classList.toggle('on',document.documentElement.getAttribute('data-theme')==='dark');
  const a=document.getElementById('swAuto');if(a)a.classList.toggle('on',autoOn());
  fetch('api/meta').then(r=>r.json()).then(m=>{const e=document.getElementById('metaDays');if(e)e.textContent=(m.all||!m.days)?'全部':(m.days+' 天');}).catch(()=>{});
  document.getElementById('settings').classList.add('show');}
function closeSettings(){document.getElementById('settings').classList.remove('show');}
function logout(){if(confirm('确定退出登录？'))location.href='/oauth2/sign_out';}
applyTheme(localStorage.getItem(LS.theme)||'light');
startAuto();
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeSettings();});

async function route(){const m=location.hash.match(/^#t\/(\d+)/);if(m){if(!CACHE.length){try{CACHE=await(await fetch('api/tickets')).json();}catch(e){}}showDetail(parseInt(m[1],10));}else showList();}
window.addEventListener('hashchange',route);route();
</script>
