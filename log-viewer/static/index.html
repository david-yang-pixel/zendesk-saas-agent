<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zd-agent 工单日志</title>
<style>
  :root{
    --bg:#ffffff;
    --ink:#191919;          /* near-black text */
    --ink-2:#454545;
    --muted:#6b6b6b;
    --faint:#9b9b9b;
    --line:#ededed;         /* hairline */
    --line-2:#f4f4f4;       /* faint hairline */
    --hover:#fafafa;
    --accent:#191919;       /* accent = ink, 极简：强调靠粗细不靠颜色 */
    --ok:#1a7f4b;
    --bad:#c0362c;
    --warn:#9a6a00;
    --tok-hot:#c0362c;
    --r:6px; --r-lg:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums}
  .mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  svg{display:block;flex:none;stroke:currentColor}
  a{color:inherit}

  .wrap{max-width:1080px;margin:0 auto;padding:0 28px}

  /* ---- top nav ---- */
  .nav{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.9);
       backdrop-filter:saturate(180%) blur(8px);-webkit-backdrop-filter:saturate(180%) blur(8px);z-index:30}
  .nav .row{display:flex;align-items:center;gap:12px;height:56px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:15px;letter-spacing:-.01em}
  .brand .mk{width:24px;height:24px;border-radius:6px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center}
  .brand .sub{color:var(--faint);font-weight:400;font-size:13px}
  .grow{flex:1}
  .ghost{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:var(--r);
         border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;transition:background .15s,color .15s}
  .ghost:hover{background:var(--hover);color:var(--ink)}

  /* ---- page head ---- */
  .head{padding:40px 0 22px}
  .head h1{font-size:26px;font-weight:680;letter-spacing:-.02em}
  .head .crumb{color:var(--faint);font-weight:400}
  .head p{color:var(--muted);font-size:13.5px;margin-top:5px}

  /* ---- stat strip (no cards, just inline numbers) ---- */
  .stats{display:flex;gap:40px;padding:4px 0 26px;flex-wrap:wrap}
  .stat .v{font-size:24px;font-weight:680;letter-spacing:-.02em;line-height:1.1}
  .stat .v.ok{color:var(--ok)} .stat .v.bad{color:var(--bad)}
  .stat .k{font-size:12.5px;color:var(--muted);margin-top:2px}

  /* ---- toolbar ---- */
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .search{display:flex;align-items:center;gap:8px;height:36px;flex:1;max-width:320px;
          border:1px solid var(--line);border-radius:var(--r);padding:0 11px;transition:border-color .15s}
  .search:focus-within{border-color:#cfcfcf}
  .search svg{stroke:var(--faint)}
  .search input{border:0;outline:0;flex:1;font-size:13.5px;background:transparent;color:var(--ink);font-family:inherit}

  /* ---- list (rows, not heavy table) ---- */
  .list{border-top:1px solid var(--line)}
  .lh{display:grid;grid-template-columns:84px 96px 1fr 130px 64px 70px 64px 44px 96px;gap:14px;
      padding:10px 8px;font-size:11.5px;color:var(--faint);font-weight:500;border-bottom:1px solid var(--line);
      text-transform:uppercase;letter-spacing:.04em}
  .lh .r,.row .r{text-align:right}
  .row{display:grid;grid-template-columns:84px 96px 1fr 130px 64px 70px 64px 44px 96px;gap:14px;
       padding:14px 8px;border-bottom:1px solid var(--line-2);align-items:center;cursor:pointer;
       transition:background .12s;border-radius:8px}
  .row:hover{background:var(--hover)}
  .tid{font-weight:650}.tid .h{color:var(--faint);font-weight:500}
  .muted{color:var(--muted)}.faint{color:var(--faint)}

  /* status: dot + text, minimal */
  .st{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;white-space:nowrap}
  .st .d{width:7px;height:7px;border-radius:50%;flex:none}
  .st.ok .d{background:var(--ok)} .st.ok{color:var(--ink-2)}
  .st.bad .d{background:var(--bad)} .st.bad{color:var(--bad)}
  .st.run .d{background:#c9c9c9} .st.run{color:var(--muted)}
  .st.warn .d{background:var(--warn)} .st.warn{color:var(--warn)}

  .vt{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ty{font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 7px;white-space:nowrap}
  .tok.hot{color:var(--tok-hot);font-weight:650}
  .ck svg{stroke:var(--ok)} .ck.no svg{stroke:var(--faint)}

  /* skeleton */
  .sk{background:linear-gradient(90deg,#f0f0f0 25%,#f7f7f7 37%,#f0f0f0 63%);background-size:400% 100%;
      animation:sh 1.3s ease infinite;border-radius:5px}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}

  .empty{padding:72px 20px;text-align:center;color:var(--muted)}
  .empty svg{stroke:#cfcfcf;margin:0 auto 12px}
  .empty .t{font-weight:600;color:var(--ink-2);font-size:15px}
  .empty .s{font-size:13px;color:var(--muted);margin-top:4px}

  /* ---- detail ---- */
  .back{display:inline-flex;align-items:center;gap:5px;color:var(--muted);cursor:pointer;font-size:13px;
        margin:6px 0 22px;user-select:none;transition:color .15s}
  .back:hover{color:var(--ink)}
  .dh h2{font-size:24px;font-weight:680;letter-spacing:-.02em;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .dh .meta{display:flex;gap:34px;flex-wrap:wrap;margin:18px 0 30px;padding-bottom:24px;border-bottom:1px solid var(--line)}
  .dh .m .v{font-size:17px;font-weight:650;letter-spacing:-.01em}
  .dh .m .k{font-size:12px;color:var(--muted);margin-top:1px}

  /* timeline — minimal, left rule */
  .tl{position:relative;margin-left:6px;padding-left:26px;border-left:1px solid var(--line)}
  .ev{position:relative;padding:0 0 26px}
  .ev:last-child{padding-bottom:4px}
  .ev .node{position:absolute;left:-33px;top:1px;width:14px;height:14px;border-radius:50%;
            background:#fff;border:2px solid #d6d6d6}
  .ev.err .node{border-color:var(--bad)} .ev.ok .node{border-color:var(--ok)} .ev.reply .node{border-color:var(--ink)}
  .ev .l1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .ev .name{font-weight:600;font-size:14px}
  .ev.err .name{color:var(--bad)}
  .ev .t{font-size:12px;color:var(--faint);font-family:ui-monospace,monospace}
  .ev .fields{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px}
  .ev .kv{color:var(--ink-2);font-family:ui-monospace,monospace}
  .ev .kv b{color:var(--faint);font-weight:500}
  .toolchip{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:0 7px;
            font-size:11.5px;color:var(--ink-2);font-family:ui-monospace,monospace;margin-right:5px}
  .ev .exp{font-size:12px;color:var(--faint);margin-top:8px;cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:4px}
  .ev .exp:hover{color:var(--muted)}
  .ev pre{display:none;margin-top:9px;padding:13px 15px;background:#fafafa;border:1px solid var(--line);
          color:#333;border-radius:8px;font-size:12px;line-height:1.65;overflow:auto;max-height:340px;
          font-family:ui-monospace,monospace}
  .ev.open pre{display:block}

  @media(max-width:760px){
    .wrap{padding:0 16px}
    .lh{display:none}
    .row{grid-template-columns:1fr auto;gap:6px 10px;padding:14px 6px}
    .row>*:nth-child(n+4){display:none}
    .stats{gap:24px}
  }
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
  <nav class="nav"><div class="wrap"><div class="row">
    <div class="brand">
      <span class="mk"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/></svg></span>
      zd-agent <span class="sub" id="crumb">工单日志</span>
    </div>
    <div class="grow"></div>
    <button class="ghost" onclick="showList()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      刷新
    </button>
  </div></div></nav>

  <main class="wrap" id="app"></main>

<script>
function ic(p,sz,sw){return `<svg width="${sz||16}" height="${sz||16}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;}
const SEARCH=ic('<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',15);
const CHECK=ic('<path d="M20 6 9 17l-5-5"/>',15);
const XMARK=ic('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',14);
const CHEV=ic('<polyline points="15 18 9 12 15 6"/>',14);
const INBOX=ic('<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',38,1.5);

const isErr=ev=>/timeout|failed|error|escalat/i.test(ev);
const isDone=ev=>ev==="agent_done";
const isReply=ev=>/reply/.test(ev);
function fmtTime(ts){ if(!ts)return""; return ts.replace("T"," ").replace("Z","").slice(5,19); }
function fmtTok(n){ return (n||n===0)?(n>=1000?(n/1000).toFixed(0)+"K":String(n)):"—"; }
function fmtEl(s){ if(s==null)return"—"; return s>=60?(s/60).toFixed(1)+"m":s.toFixed(0)+"s"; }
function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function statusEl(s){
  if(!s) return `<span class="st run"><span class="d"></span>处理中</span>`;
  if(s==="completed") return `<span class="st ok"><span class="d"></span>已完成</span>`;
  if(s==="failed") return `<span class="st bad"><span class="d"></span>失败</span>`;
  return `<span class="st warn"><span class="d"></span>${esc(s)}</span>`;
}

let CACHE=[];

async function showList(){
  if(location.hash){ location.hash=""; return; }
  document.getElementById("crumb").textContent="工单日志";
  const app=document.getElementById("app");
  app.innerHTML=skeleton();
  let rows;
  try{ rows=await (await fetch("api/tickets")).json(); }
  catch(e){ app.innerHTML=`<div class="head"><h1>工单日志</h1></div>`+empty("加载失败",String(e)); return; }
  CACHE=rows;

  const total=rows.length,
        done=rows.filter(r=>r.status==="completed").length,
        failed=rows.filter(r=>r.status==="failed").length,
        wr=rows.filter(r=>r.rounds!=null),
        avg=wr.length?Math.round(wr.reduce((a,r)=>a+r.rounds,0)/wr.length):"—";

  let h=`<div class="head">
    <h1>工单日志</h1>
    <p>Dify SaaS Support Agent 的工单处理记录</p>
  </div>
  <div class="stats">
    <div class="stat"><div class="v num">${total}</div><div class="k">总工单</div></div>
    <div class="stat"><div class="v ok num">${done}</div><div class="k">已完成</div></div>
    <div class="stat"><div class="v ${failed?'bad':''} num">${failed}</div><div class="k">失败</div></div>
    <div class="stat"><div class="v num">${avg}</div><div class="k">平均轮数</div></div>
  </div>
  <div class="toolbar">
    <label class="search">${SEARCH}<input id="q" placeholder="搜工单号…" oninput="filter()"></label>
  </div>
  <div class="list">
    <div class="lh">
      <span>工单</span><span>状态</span><span>verdict</span><span>类型</span>
      <span class="r">轮数</span><span class="r">token</span><span class="r">耗时</span>
      <span class="r">回复</span><span class="r">时间</span>
    </div><div id="tb">`;
  if(!total) h+=empty("暂无日志","agent 处理工单后自动出现");
  for(const s of rows){
    const hot=s.total_tokens&&s.total_tokens>1000000?"hot":"";
    const rep=s.reply_sent===true?`<span class="ck">${CHECK}</span>`:`<span class="ck no">${XMARK}</span>`;
    h+=`<div class="row" data-id="${s.ticket_id}" onclick="go(${s.ticket_id})">
      <span class="tid"><span class="h">#</span>${s.ticket_id}</span>
      <span>${statusEl(s.status)}</span>
      <span class="vt">${s.verdict?esc(s.verdict):'<span class="faint">—</span>'}</span>
      <span>${s.ticket_type?`<span class="ty">${esc(s.ticket_type)}</span>`:'<span class="faint">—</span>'}</span>
      <span class="r num">${s.rounds??'<span class="faint">—</span>'}</span>
      <span class="r num tok ${hot}">${fmtTok(s.total_tokens)}</span>
      <span class="r num muted">${fmtEl(s.elapsed)}</span>
      <span class="r">${rep}</span>
      <span class="r mono faint" style="font-size:12px">${fmtTime(s.last_time)}</span>
    </div>`;
  }
  h+=`</div></div>`;
  app.innerHTML=h;
}

function skeleton(){
  let r="";
  for(let i=0;i<7;i++) r+=`<div class="row"><div class="sk" style="height:16px;width:100%;grid-column:1/-1"></div></div>`;
  return `<div class="head"><div class="sk" style="height:30px;width:160px"></div></div>
    <div class="stats">${[0,0,0,0].map(()=>`<div class="stat"><div class="sk" style="height:24px;width:40px;margin-bottom:6px"></div><div class="sk" style="height:12px;width:50px"></div></div>`).join("")}</div>
    <div class="toolbar"><div class="sk" style="height:36px;width:320px;border-radius:6px"></div></div>
    <div class="list"><div id="tb">${r}</div></div>`;
}
function empty(t,s){ return `<div class="empty">${INBOX}<div class="t">${esc(t)}</div><div class="s">${esc(s||"")}</div></div>`; }

function filter(){
  const q=document.getElementById("q").value.trim();
  document.querySelectorAll("#tb .row").forEach(el=>{
    const id=el.getAttribute("data-id")||"";
    el.style.display=!q||id.includes(q)?"":"none";
  });
}
function go(id){ location.hash="t/"+id; }

async function showDetail(id){
  document.getElementById("crumb").textContent="工单日志 / #"+id;
  const app=document.getElementById("app");
  app.innerHTML=`<div class="back" onclick="location.hash=''">${CHEV}返回</div>
    <div class="sk" style="height:90px;border-radius:10px;margin-bottom:24px"></div>
    <div class="sk" style="height:200px;border-radius:10px;margin-left:30px"></div>`;
  let tl;
  try{ tl=await (await fetch("api/tickets/"+id)).json(); }
  catch(e){ app.innerHTML=empty("加载失败",String(e)); return; }
  const sum=CACHE.find(r=>r.ticket_id===id)||{};

  let h=`<div class="back" onclick="location.hash=''">${CHEV}返回</div>
    <div class="dh">
      <h2><span class="faint" style="font-weight:600">#</span>${id} ${statusEl(sum.status)}</h2>
      <div class="meta">
        <div class="m"><div class="v num">${tl.length}</div><div class="k">事件</div></div>
        <div class="m"><div class="v num">${sum.rounds??'—'}</div><div class="k">轮数</div></div>
        <div class="m"><div class="v num">${fmtTok(sum.total_tokens)}</div><div class="k">Token</div></div>
        <div class="m"><div class="v num">${fmtEl(sum.elapsed)}</div><div class="k">耗时</div></div>
        <div class="m"><div class="v" style="font-size:14px">${sum.verdict||'—'}</div><div class="k">verdict</div></div>
        <div class="m"><div class="v" style="font-size:14px">${sum.ticket_type||'—'}</div><div class="k">类型</div></div>
      </div>
    </div>
    <div class="tl">`;
  if(!tl.length) h+=empty("无事件","");
  for(const e of tl){
    const ev=e.event||"";
    const cls=isErr(ev)?"err":isDone(ev)?"ok":isReply(ev)?"reply":"";
    let fields="";
    for(const [k,v] of Object.entries(e)){
      if(["event","timestamp","level","module","ticket_id"].includes(k)) continue;
      if(k==="tool_names"&&Array.isArray(v)){
        fields+=`<span class="kv"><b>tools</b> `+v.map(t=>`<span class="toolchip">${esc(t)}</span>`).join("")+`</span>`;
      }else{
        let val=typeof v==="object"?JSON.stringify(v):String(v);
        if(val.length>72) val=val.slice(0,72)+"…";
        fields+=`<span class="kv"><b>${esc(k)}</b> ${esc(val)}</span>`;
      }
    }
    h+=`<div class="ev ${cls}">
      <span class="node"></span>
      <div class="l1"><span class="name">${esc(ev)}</span><span class="t">${fmtTime(e.timestamp)}</span></div>
      ${fields?`<div class="fields">${fields}</div>`:""}
      <span class="exp" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='block'?'none':'block'">${CHEV} 原始 JSON</span>
      <pre>${esc(JSON.stringify(e,null,2))}</pre>
    </div>`;
  }
  h+=`</div>`;
  app.innerHTML=h;
}

async function route(){
  const m=location.hash.match(/^#t\/(\d+)/);
  if(m){ if(!CACHE.length){try{CACHE=await(await fetch("api/tickets")).json();}catch(e){}} showDetail(parseInt(m[1],10)); }
  else showList();
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
