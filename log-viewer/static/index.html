<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zd-agent · 工单日志</title>
<style>
  :root{
    /* sidebar (dark) */
    --sb:#0e0f1a; --sb-2:#16182a; --sb-line:#23263b;
    --sb-tx:#9aa0b8; --sb-tx-dim:#646a86; --sb-hi:#ffffff;
    /* content (light) */
    --bg:#f7f8fa; --panel:#ffffff;
    --ink:#14151f; --ink-2:#3d4255; --muted:#6b7185; --faint:#9aa0b0;
    --line:#e9ebf0; --line-2:#f1f2f6; --hover:#f8f9fc;
    --brand:#5b5bf0; --brand-2:#7b7bff; --brand-weak:#eeeefe; --brand-ink:#4a44d6;
    --ok:#0e9f6e; --ok-weak:#e6f6ef; --ok-ink:#057a55;
    --bad:#e02424; --bad-weak:#fdeaea; --bad-ink:#c81e1e;
    --warn:#c27803; --warn-weak:#fdf6e3; --warn-ink:#9a6700;
    --slate:#566074; --slate-weak:#eef0f4;
    --r:8px; --r-lg:14px; --r-xl:18px;
    --sh:0 1px 2px rgba(20,21,31,.04),0 1px 3px rgba(20,21,31,.06);
    --sh-2:0 6px 18px rgba(20,21,31,.08),0 2px 6px rgba(20,21,31,.05);
    --sh-pop:0 18px 50px rgba(20,21,31,.16);
    --sbw:248px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
       background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}
  .mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  svg{display:block;flex:none;stroke:currentColor}

  /* ============ SIDEBAR ============ */
  .sb{
    position:fixed;left:0;top:0;bottom:0;width:var(--sbw);z-index:40;
    background:var(--sb);border-right:1px solid var(--sb-line);
    display:flex;flex-direction:column;padding:16px 14px;
  }
  .sb .brand{display:flex;align-items:center;gap:11px;padding:8px 8px 16px;margin-bottom:6px;border-bottom:1px solid var(--sb-line)}
  .sb .brand .mk{width:34px;height:34px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--brand-2),var(--brand));color:#fff;
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(91,91,240,.4)}
  .sb .brand .tx b{display:block;color:var(--sb-hi);font-size:15px;font-weight:700;letter-spacing:-.01em}
  .sb .brand .tx span{font-size:11.5px;color:var(--sb-tx-dim)}
  .sb .grp{font-size:11px;color:var(--sb-tx-dim);font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:14px 10px 6px}
  .sb nav{display:flex;flex-direction:column;gap:2px}
  .sb a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r);
        color:var(--sb-tx);font-size:13.5px;text-decoration:none;cursor:pointer;
        transition:background .16s,color .16s;position:relative}
  .sb a svg{width:18px;height:18px;stroke:var(--sb-tx-dim);transition:stroke .16s}
  .sb a:hover{background:var(--sb-2);color:var(--sb-hi)}
  .sb a:hover svg{stroke:var(--sb-tx)}
  .sb a.on{background:var(--sb-2);color:var(--sb-hi);font-weight:500}
  .sb a.on svg{stroke:var(--brand-2)}
  .sb a.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brand-2)}
  .sb a .badge{margin-left:auto;font-size:11px;background:var(--sb-line);color:var(--sb-tx);border-radius:20px;padding:1px 8px;font-weight:600}
  .sb .foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--sb-line)}
  .sb .foot .who{display:flex;align-items:center;gap:9px}
  .sb .foot .av{width:28px;height:28px;border-radius:50%;background:var(--sb-2);border:1px solid var(--sb-line);
    display:flex;align-items:center;justify-content:center;color:var(--sb-tx);font-size:12px;font-weight:700}
  .sb .foot .nm{font-size:12.5px;color:var(--sb-tx)} .sb .foot .nm small{display:block;color:var(--sb-tx-dim);font-size:11px}

  /* ============ MAIN ============ */
  .main{margin-left:var(--sbw);min-height:100vh;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:30;height:60px;display:flex;align-items:center;gap:14px;
    padding:0 28px;background:rgba(247,248,250,.82);backdrop-filter:saturate(180%) blur(10px);
    -webkit-backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line)}
  .topbar h1{font-size:16px;font-weight:680;letter-spacing:-.01em}
  .topbar .crumb{color:var(--faint);font-weight:400}
  .grow{flex:1}
  .search{display:flex;align-items:center;gap:8px;height:38px;width:280px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:0 12px;box-shadow:var(--sh);transition:border-color .16s,box-shadow .16s}
  .search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-weak)}
  .search svg{stroke:var(--faint)} .search input{border:0;outline:0;flex:1;background:transparent;font-size:13.5px;color:var(--ink);font-family:inherit}
  .btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border:1px solid var(--line);
    background:var(--panel);border-radius:10px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;
    box-shadow:var(--sh);transition:border-color .16s,color .16s;font-family:inherit}
  .btn:hover{border-color:#cdd2dd;color:var(--ink)}
  .body{padding:26px 28px 56px;max-width:1280px;width:100%}

  /* ---- KPI ---- */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh);
    display:flex;align-items:flex-start;gap:14px;transition:box-shadow .16s,transform .16s}
  .kpi:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}
  .kpi .ic{width:42px;height:42px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center}
  .kpi.a .ic{background:var(--brand-weak)} .kpi.a .ic svg{stroke:var(--brand)}
  .kpi.b .ic{background:var(--ok-weak)} .kpi.b .ic svg{stroke:var(--ok)}
  .kpi.c .ic{background:var(--bad-weak)} .kpi.c .ic svg{stroke:var(--bad)}
  .kpi.d .ic{background:var(--warn-weak)} .kpi.d .ic svg{stroke:var(--warn)}
  .kpi .lab{font-size:12.5px;color:var(--muted);font-weight:500}
  .kpi .val{font-size:27px;font-weight:720;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
  .kpi.b .val{color:var(--ok-ink)} .kpi.c .val{color:var(--bad-ink)} .kpi.d .val{color:var(--brand-ink)}

  /* ---- card / table ---- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden}
  .card-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
  .card-h .t{font-size:14px;font-weight:650} .card-h .n{font-size:12px;color:var(--muted);background:var(--slate-weak);border-radius:20px;padding:2px 9px;font-weight:600}
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:860px}
  thead th{background:#fbfcfe;font-size:11.5px;font-weight:600;color:var(--muted);text-align:left;
    padding:11px 18px;border-bottom:1px solid var(--line-2);letter-spacing:.03em;white-space:nowrap}
  thead th.r,tbody td.r{text-align:right}
  tbody td{padding:14px 18px;border-bottom:1px solid var(--line-2);font-size:13.5px;vertical-align:middle;white-space:nowrap}
  tbody tr{cursor:pointer;transition:background .13s}
  tbody tr:hover{background:var(--hover)}
  tbody tr:last-child td{border-bottom:0}
  .tid{font-weight:700}.tid .h{color:var(--faint);font-weight:600}
  .muted{color:var(--muted)}.faint{color:var(--faint)}
  .pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:600;white-space:nowrap}
  .pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
  .p-ok{background:var(--ok-weak);color:var(--ok-ink)} .p-bad{background:var(--bad-weak);color:var(--bad-ink)}
  .p-warn{background:var(--warn-weak);color:var(--warn-ink)} .p-run{background:var(--slate-weak);color:var(--slate)}
  .tag{display:inline-block;height:23px;line-height:21px;padding:0 9px;border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--ink-2);font-weight:500}
  .tok.hot{color:var(--bad-ink);font-weight:700}
  .ck svg{stroke:var(--ok)} .ck.no svg{stroke:var(--faint)}

  .sk{background:linear-gradient(90deg,#eef0f4 25%,#f6f7fa 37%,#eef0f4 63%);background-size:400% 100%;animation:sh 1.3s ease infinite;border-radius:6px}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
  .empty{padding:70px 20px;text-align:center;color:var(--muted)}
  .empty svg{stroke:var(--faint);margin:0 auto 12px} .empty .t{font-weight:600;color:var(--ink-2);font-size:15px} .empty .s{font-size:13px;margin-top:4px}

  /* ---- detail ---- */
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--brand);cursor:pointer;font-size:13.5px;font-weight:500;margin-bottom:18px;user-select:none}
  .back:hover{color:var(--brand-ink)}
  .dh{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);margin-bottom:22px;overflow:hidden}
  .dh .r1{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:20px 24px 18px}
  .dh h2{font-size:22px;font-weight:720;letter-spacing:-.01em}
  .dh .grid{display:flex;border-top:1px solid var(--line-2)}
  .dh .m{flex:1;padding:14px 24px;border-right:1px solid var(--line-2)} .dh .m:last-child{border-right:0}
  .dh .m .k{font-size:11.5px;color:var(--muted)} .dh .m .v{font-size:18px;font-weight:700;margin-top:2px;letter-spacing:-.01em}

  .tl{position:relative;margin-left:7px;padding-left:28px;border-left:2px solid var(--line)}
  .ev{position:relative;padding-bottom:18px}
  .ev:last-child{padding-bottom:2px}
  .ev .node{position:absolute;left:-37px;top:9px;width:18px;height:18px;border-radius:50%;background:var(--panel);
    border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
  .ev .node svg{width:10px;height:10px;stroke:var(--muted)}
  .ev.err .node{border-color:var(--bad);background:var(--bad-weak)} .ev.err .node svg{stroke:var(--bad)}
  .ev.ok .node{border-color:var(--ok);background:var(--ok-weak)} .ev.ok .node svg{stroke:var(--ok)}
  .ev.reply .node{border-color:var(--brand);background:var(--brand-weak)} .ev.reply .node svg{stroke:var(--brand)}
  .ev .bd{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 15px;box-shadow:var(--sh);cursor:pointer;transition:border-color .14s,box-shadow .14s}
  .ev .bd:hover{border-color:#d4d9e4;box-shadow:var(--sh-2)} .ev.err .bd{border-color:#f4cccc;background:#fffbfb}
  .ev .l1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .ev .name{font-weight:650;font-size:13.5px} .ev.err .name{color:var(--bad-ink)}
  .ev .t{font-size:11.5px;color:var(--faint);font-family:ui-monospace,monospace;margin-left:auto}
  .ev .fields{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px 16px;font-size:12.5px}
  .ev .kv{color:var(--ink-2);font-family:ui-monospace,monospace} .ev .kv b{color:var(--muted);font-weight:600}
  .toolchip{display:inline-block;background:var(--brand-weak);color:var(--brand-ink);border-radius:6px;padding:1px 8px;margin-right:5px;font-size:11.5px;font-weight:600;font-family:ui-monospace,monospace}
  .ev .exp{font-size:11.5px;color:var(--faint);margin-top:8px;cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:4px}
  .ev .exp:hover{color:var(--muted)}
  .ev pre{display:none;margin-top:10px;padding:13px;background:#0e0f1a;color:#cdd6f4;border-radius:9px;font-size:12px;line-height:1.65;overflow:auto;max-height:360px;font-family:ui-monospace,monospace}
  .ev.open pre{display:block}

  /* mobile: drawer */
  .burger{display:none}
  .scrim{display:none}
  @media(max-width:880px){
    .sb{transform:translateX(-100%);transition:transform .22s}
    body.nav-open .sb{transform:none}
    .main{margin-left:0}
    .burger{display:inline-flex}
    body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .body{padding:18px}.topbar{padding:0 16px}.search{width:150px}
  }
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
  <aside class="sb">
    <div class="brand">
      <span class="mk"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg></span>
      <span class="tx"><b>zd-agent</b><span>SaaS Support</span></span>
    </div>
    <div class="grp">监控</div>
    <nav>
      <a class="on" onclick="nav('list',this)"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>工单列表<span class="badge" id="navCount">—</span></a>
    </nav>
    <div class="foot">
      <div class="who"><span class="av">D</span><span class="nm">dify.ai<small>已登录</small></span></div>
    </div>
  </aside>
  <div class="scrim" onclick="document.body.classList.remove('nav-open')"></div>

  <div class="main">
    <header class="topbar">
      <button class="btn burger" onclick="document.body.classList.toggle('nav-open')" aria-label="menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <h1>工单日志 <span class="crumb" id="crumb"></span></h1>
      <div class="grow"></div>
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="q" placeholder="搜工单号…" oninput="filter()" disabled></label>
      <button class="btn" onclick="showList()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>刷新</button>
    </header>
    <main class="body" id="app"></main>
  </div>

<script>
function ic(p,sz,sw){return `<svg width="${sz||16}" height="${sz||16}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;}
const I={
  layers:'<polyline points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
  check2:'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
  xcirc:'<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',
  loop:'<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
  check:'<path d="M20 6 9 17l-5-5"/>', x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  chev:'<polyline points="15 18 9 12 15 6"/>',
  tag:'<path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>',
  target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  tool:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  arch:'<polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/>',
  done:'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
  alert:'<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  play:'<polygon points="5 3 19 12 5 21 5 3"/>', box:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>',
  note:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
  dot:'<circle cx="12" cy="12" r="5"/>', inbox:'<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
};
const EV={ticket_classified:"tag",trigger_verdict:"target",round_tool_calls:"tool",public_reply_sent:"msg",public_reply_send_start:"msg",internal_reply_auto_public_sent:"msg",compaction_triggered:"arch",agent_done:"done",agent_start:"play",ack_note_sent:"note",sandbox_created:"box",trigger_enter_silence:"clock"};
const isErr=e=>/timeout|failed|error|escalat/i.test(e), isDone=e=>e==="agent_done", isReply=e=>/reply/.test(e);
function evIcon(e){return isErr(e)?ic(I.alert,10):ic(I[EV[e]||"dot"],10);}
function fmtTime(t){return t?t.replace("T"," ").replace("Z","").slice(5,19):"";}
function fmtTok(n){if(n==null||n==="")return"—";const v=typeof n==="number"?n:parseFloat(String(n).replace(/[^\d.]/g,""));if(!isFinite(v))return String(n);return v>=1000?(v/1000).toFixed(0)+"K":""+v;}
function fmtEl(s){if(s==null||s==="")return"—";const v=typeof s==="number"?s:parseFloat(String(s).replace(/[^\d.]/g,""));if(!isFinite(v))return String(s);return v>=60?(v/60).toFixed(1)+"m":v.toFixed(0)+"s";}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function st(s){if(!s)return `<span class="pill p-run"><span class="d"></span>处理中</span>`;if(s==="completed")return `<span class="pill p-ok"><span class="d"></span>completed</span>`;if(s==="failed")return `<span class="pill p-bad"><span class="d"></span>failed</span>`;return `<span class="pill p-warn"><span class="d"></span>${esc(s)}</span>`;}
function vtag(v){return v?`<span class="tag">${esc(v)}</span>`:'<span class="faint">—</span>';}

let CACHE=[];
function nav(what,el){
  document.body.classList.remove('nav-open');
  location.hash='';
}

async function showList(){
  if(location.hash){location.hash='';return;}
  document.getElementById('crumb').textContent='';
  const app=document.getElementById('app');
  app.innerHTML=skeleton();
  let rows; try{rows=await(await fetch('api/tickets')).json();}catch(e){app.innerHTML=empty('加载失败',String(e));return;}
  CACHE=rows; document.getElementById('q').disabled=false;
  document.getElementById('navCount').textContent=rows.length;
  document.querySelectorAll('.sb a').forEach(a=>a.classList.remove('on'));
  document.querySelector('.sb nav a').classList.add('on');

  const total=rows.length,done=rows.filter(r=>r.status==="completed").length,
    failed=rows.filter(r=>r.status==="failed").length,
    wr=rows.filter(r=>r.rounds!=null),avg=wr.length?Math.round(wr.reduce((a,r)=>a+r.rounds,0)/wr.length):"—";
  let h=`<div class="kpis">
    ${kpi('a','layers','总工单',total)}
    ${kpi('b','check2','已完成',done)}
    ${kpi('c','xcirc','失败',failed)}
    ${kpi('d','loop','平均轮数',avg)}
  </div>
  <div class="card">
    <div class="card-h"><span class="t">处理记录</span><span class="n">${total}</span></div>
    <div class="tw"><table><thead><tr>
      <th>工单</th><th>状态</th><th>verdict</th><th>类型</th>
      <th class="r">轮数</th><th class="r">token</th><th class="r">耗时</th><th>回复</th><th>最后时间</th>
    </tr></thead><tbody id="tb">`;
  if(!total)h+=`<tr><td colspan="9">${empty('暂无日志','agent 处理工单后自动出现')}</td></tr>`;
  for(const s of rows){
    const hot=s.total_tokens&&s.total_tokens>1000000?"hot":"";
    const rep=s.reply_sent===true?`<span class="ck">${ic(I.check,16)}</span>`:`<span class="ck no">${ic(I.x,15)}</span>`;
    h+=`<tr data-id="${s.ticket_id}" onclick="go(${s.ticket_id})">
      <td class="tid"><span class="h">#</span>${s.ticket_id}</td>
      <td>${st(s.status)}</td><td>${vtag(s.verdict)}</td>
      <td>${s.ticket_type?`<span class="tag">${esc(s.ticket_type)}</span>`:'<span class="faint">—</span>'}</td>
      <td class="r num">${s.rounds??'<span class="faint">—</span>'}</td>
      <td class="r num tok ${hot}">${fmtTok(s.total_tokens)}</td>
      <td class="r num muted">${fmtEl(s.elapsed)}</td>
      <td>${rep}</td><td class="mono faint">${fmtTime(s.last_time)}</td>
    </tr>`;
  }
  h+=`</tbody></table></div></div>`;
  app.innerHTML=h;
}
function kpi(c,i,l,v){return `<div class="kpi ${c}"><div class="ic">${ic(I[i],20)}</div><div><div class="lab">${l}</div><div class="val num">${v}</div></div></div>`;}
function skeleton(){let r="";for(let i=0;i<6;i++)r+=`<tr><td colspan="9"><div class="sk" style="height:18px"></div></td></tr>`;
  return `<div class="kpis">${[0,0,0,0].map(()=>`<div class="kpi"><div class="sk" style="width:42px;height:42px;border-radius:11px"></div><div style="flex:1"><div class="sk" style="height:12px;width:50px;margin-bottom:8px"></div><div class="sk" style="height:24px;width:64px"></div></div></div>`).join("")}</div><div class="card"><div class="card-h"><div class="sk" style="height:16px;width:88px"></div></div><div class="tw"><table><tbody>${r}</tbody></table></div></div>`;}
function empty(t,s){return `<div class="empty">${ic(I.inbox,40,1.5)}<div class="t">${esc(t)}</div><div class="s">${esc(s||"")}</div></div>`;}
function filter(){const q=document.getElementById('q').value.trim();document.querySelectorAll('#tb tr').forEach(tr=>{const id=tr.getAttribute('data-id')||"";tr.style.display=!q||id.includes(q)?"":"none";});}
function go(id){location.hash="t/"+id;}

async function showDetail(id){
  document.getElementById('crumb').textContent="/ #"+id;
  document.getElementById('q').disabled=true;
  const app=document.getElementById('app');
  app.innerHTML=`<div class="sk" style="height:108px;border-radius:14px;margin-bottom:22px"></div>`+[0,0,0,0].map(()=>`<div class="sk" style="height:54px;border-radius:11px;margin:0 0 18px 35px"></div>`).join("");
  let tl;try{tl=await(await fetch('api/tickets/'+id)).json();}catch(e){app.innerHTML=empty('加载失败',String(e));return;}
  const sum=CACHE.find(r=>r.ticket_id===id)||{};
  let h=`<div class="back" onclick="location.hash=''">${ic(I.chev,16)}返回列表</div>
    <div class="dh"><div class="r1"><h2><span class="faint" style="font-weight:600">#</span>${id}</h2>${st(sum.status)}${vtag(sum.verdict)}</div>
    <div class="grid">
      <div class="m"><div class="k">事件</div><div class="v num">${tl.length}</div></div>
      <div class="m"><div class="k">轮数</div><div class="v num">${sum.rounds??'—'}</div></div>
      <div class="m"><div class="k">Token</div><div class="v num">${fmtTok(sum.total_tokens)}</div></div>
      <div class="m"><div class="k">耗时</div><div class="v num">${fmtEl(sum.elapsed)}</div></div>
      <div class="m"><div class="k">类型</div><div class="v" style="font-size:14px">${sum.ticket_type||'—'}</div></div>
    </div></div><div class="tl">`;
  if(!tl.length)h+=empty('无事件','');
  for(const e of tl){
    const ev=e.event||"",cls=isErr(ev)?"err":isDone(ev)?"ok":isReply(ev)?"reply":"";
    let f="";for(const[k,v] of Object.entries(e)){if(["event","timestamp","level","module","ticket_id"].includes(k))continue;
      if(k==="tool_names"&&Array.isArray(v))f+=`<span class="kv"><b>tools</b> `+v.map(t=>`<span class="toolchip">${esc(t)}</span>`).join("")+`</span>`;
      else{let val=typeof v==="object"?JSON.stringify(v):String(v);if(val.length>72)val=val.slice(0,72)+"…";f+=`<span class="kv"><b>${esc(k)}</b> ${esc(val)}</span>`;}}
    h+=`<div class="ev ${cls}"><span class="node">${evIcon(ev)}</span><div class="bd" onclick="this.classList.toggle('open')">
      <div class="l1"><span class="name">${esc(ev)}</span><span class="t">${fmtTime(e.timestamp)}</span></div>
      ${f?`<div class="fields">${f}</div>`:""}<div class="exp">${ic(I.chev,12)} 原始 JSON</div>
      <pre>${esc(JSON.stringify(e,null,2))}</pre></div></div>`;
  }
  h+=`</div>`;app.innerHTML=h;
}
async function route(){const m=location.hash.match(/^#t\/(\d+)/);if(m){if(!CACHE.length){try{CACHE=await(await fetch('api/tickets')).json();}catch(e){}}showDetail(parseInt(m[1],10));}else showList();}
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
