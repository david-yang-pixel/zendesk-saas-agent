agent:
  max_concurrent_sessions: 3
  # 只计算拿到执行槽后的工单处理时间；排队等待不占这 1440 秒。
  session_timeout_seconds: 1440
llm:
  provider: openai
  model: gpt-5.5
  # 空字符串 = 模型默认。GPT-5.6 带工具且为空时会安全使用 none；在管理后台
  # 选择 low/medium/high/xhigh/max 后，工具轮会自动切到 Responses API。
  reasoning_effort: ''
  # 下载 Zendesk 图片后以受控 data URL 注入主模型；附件网络与大小校验仍由工具层强制。
  enable_vision_input: true
  temperature: 0.2
  max_tokens: 0
  # 单次活跃请求上下文容量；整单只受 agent 运行时限约束。
  context_window_tokens: 272000
resources:
  base_dir: /opt/zd-agent/resources
  saas_codebase_dir: saas源代码
  ticket_records_dir: zendesk-cli/工单记录
  attachments_dir: 工单附件
  state_dir: .state
archive:
  # 仅保存 Agent 运行归档，不作为工单证据源。
  archive_dir: /opt/zd-agent/resources/agent-runs
zendesk:
  subdomain: ''
  search_query: status:new tags:saas
  # Webhook 漏单兜底必须同时覆盖 new 和 open；实际消息游标仍由状态机去重。
  backfill_query: status<solved tags:saas
  poll_interval_seconds: 300
  mention_trigger: '@saas-agent'
  mention_aliases:
    - '@yonggang'
  mention_poll_interval_seconds: 5
  # Agent 使用的 Zendesk user_id；自动公开回复也用它作为作者标记。
  # 部署时替换成你的 Zendesk agent 账号 ID。
  agent_user_id: 0
  # Zendesk Messaging / 队列自动化身份，不算人工受托人。
  # 46493567999892 = Zendesk Messaging "AI Agent" automation identity.
  non_human_assignee_ids: [46493567999892]
  # 灰度上线：首次 v2 部署只处理 ID ≥ 2624 的工单。
  # 0 = 不过滤；上线稳定后改 0 处理全部 SaaS 工单。
  min_ticket_id: 2624
webhook:
  listen_host: 127.0.0.1
  listen_port: 8080
  zendesk_path: /webhook/zendesk
public_reply:
  # 客户写入总开关。false 时 v2 仍调查并生成草稿，但不会调用 Browser Relay，
  # 也不会回落到旧 Internal Note / handoff 决策链。
  enabled: true
  # 完整审计仍保留在本地 run archive；不再向 Zendesk 写入 Internal Analysis 私有备注。
  internal_audit_note_enabled: false
  # SaaS 工单创建/客户补充后立即读取完整会话；最终发送前仍会再次刷新。
  silent_initial_wait_seconds: 0
  silence_window_seconds: 0
  browser_relay_url: https://zendesk.smlershou.top/zendesk-reply-mcp
  # 控制面直接检查同机 Relay，不经过 Cloudflare；失效时自动关闭 Agent 接入。
  browser_relay_readiness_url: http://127.0.0.1:8097/ready
  browser_relay_readiness_interval_seconds: 30
  # Reuse the already-deployed /webhook/ reverse-proxy boundary. The aiohttp
  # route itself still requires the browser-relay Bearer token.
  freshness_callback_url: https://zendesk.smlershou.top/webhook/relay-pre-send-freshness
  browser_relay_timeout_seconds: 90
casework:
  # v2 是唯一生产决策路径；canary 模式仅暂缓未列入白名单的工单。
  mode: casework
  # 70% 生成结构化检查点；88% 是禁止继续膨胀的硬边界。
  context_compaction_soft_ratio: 0.70
  context_compaction_hard_ratio: 0.88
  context_checkpoint_max_tokens: 12000
  context_retain_recent_rounds: 2
sandbox:
  # 只供 CLI 查看/清理 pre-v2 取证文件；v2 不使用 sandbox 执行工具。
  base_dir: /opt/zd-agent/resources/sandbox
zendesk_mcp:
  # Zendesk 读取 / Internal Note / 标签 / 关注走独立 Zendesk MCP。
  # public reply 仍走 zendesk-browser-relay。
  mcp_url: ''
  # 由环境变量 ZENDESK_MCP_API_KEY 注入，不要写入仓库。
  mcp_api_key: ''
  request_timeout_seconds: 35
intake:
  # v2 intake 仅负责 durable queue 去抖，不再做旧 verdict 分类。
  silence_minutes_default: 0
  post_agent_cooldown_seconds: 180
silence_waker:
  scan_interval_seconds: 1
waiting_poller:
  # 60s → 300s：messaging webhook 接管客户消息检测后，poller 退化为低频兜底。
  # 真正的实时来源是 /webhook/zendesk-messaging（messaging_ticket.message_added）。
  scan_interval_seconds: 300
  # 超时后仅停止自动化并记录原因，不自动转人工。
  customer_wait_timeout_hours: 24
db_gateway:
  # agent 只调用外部 DB Gateway；Teleport / DB proxy / 续期属于同级 db-gateway 项目。
  url: ''
  # 由环境变量 DB_GATEWAY_API_KEY 注入，不要写入仓库。
  api_key: ''
  # agent 调远程 Streamable HTTP MCP：DB_GATEWAY_URL + /mcp。
  request_timeout_seconds: 35
signoz:
  # agent 只调用外部 SigNoz MCP；SIGNOZ_URL / SIGNOZ_API_KEY 属于同级 signoz-mcp 项目。
  mcp_url: ''
  # 由环境变量 SIGNOZ_MCP_API_KEY 注入，不要写入仓库。
  mcp_api_key: ''
  request_timeout_seconds: 35
source_mcp:
  # agent 只调用外部 Source MCP 查询 SaaS 源码；默认 ref=runtime = 线上正在跑的代码。
  mcp_url: ''
  # 由环境变量 SOURCE_MCP_API_KEY 注入，不要写入仓库。
  mcp_api_key: ''
  request_timeout_seconds: 45
github_mcp:
  # GitHub PR / Issue / Code Search 只调用独立 github-mcp；GITHUB_TOKEN 属于该服务。
  mcp_url: ''
  mcp_api_key: ''
  request_timeout_seconds: 35
docs_tool_service:
  # 官方文档 llms.txt 缓存、限域读取只调用独立 docs-tool-service。
  mcp_url: ''
  mcp_api_key: ''
  request_timeout_seconds: 35
notification_service:
  # 飞书 webhook 凭据、签名和重试只属于独立 notification-service。
  mcp_url: ''
  mcp_api_key: ''
  request_timeout_seconds: 35
repos:
  base_dir: ''
  repositories:
  - dify
  - dify-billing
  - dify-marketplace-backend
  - dify-marketplace-frontend
  - dify-plugin-daemon
  - saas-deploy
  aliases:
    d: dify
    main: dify
    billing: dify-billing
    bill: dify-billing
    mb: dify-marketplace-backend
    marketplace-backend: dify-marketplace-backend
    mf: dify-marketplace-frontend
    marketplace-frontend: dify-marketplace-frontend
    plugin: dify-plugin-daemon
    daemon: dify-plugin-daemon
    deploy: saas-deploy
