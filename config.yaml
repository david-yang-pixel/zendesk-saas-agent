agent:
  max_concurrent_sessions: 2
  guardrails:
    max_rounds: 30
    timeout_seconds: 600
    max_tokens_per_session: 500000
    compaction_threshold: 0.65
llm:
  provider: openai
  model: gpt-5.4
  temperature: 0.2
  max_tokens: 0
resources:
  base_dir: /opt/zd-agent/resources
  saas_codebase_dir: saas源代码
  knowledge_base_dir: saas版知识库
  ticket_records_dir: zendesk-cli/工单记录
  attachments_dir: 工单附件
  state_dir: .state
zendesk:
  subdomain: ''
  search_query: status:new tags:saas
  poll_interval_seconds: 300
  mention_trigger: '@yonggang'
  mention_poll_interval_seconds: 60
  # yonggang@dify.ai 的 zendesk user_id；waiting_poller 据此判定真人接手
  agent_user_id: 45433304089364
webhook:
  listen_host: 127.0.0.1
  listen_port: 8080
  zendesk_path: /webhook/zendesk
feishu:
  webhook_url: ''
  daily_summary_time: 09:00
  daily_summary_timezone: Asia/Shanghai
trigger_decider:
  llm_model: gpt-5.4-mini
  silence_minutes_default: 3
  silence_extend_to_minutes: 5
  rapid_burst_window_seconds: 30
  rapid_burst_threshold: 2
  insufficient_timeout_minutes: 20
  abandoned_hours: 24
  greeting_only_alert_minutes: 30
  # 主动公开 ask 默认关闭；等 messaging 回复路径验证后再 flip
  enable_public_nudge: false
silence_waker:
  scan_interval_seconds: 30
waiting_poller:
  scan_interval_seconds: 60
  abandoned_hours: 24
  greeting_alert_minutes: 30
postgres:
  host: localhost
  port: 56061
  user: pro_ops_teleport_read
  db_prod: langgenius
  db_billing: billing
  db_plugin: dify_plugin_daemon
  query_timeout_seconds: 30
  max_rows: 1000
  port_prod: 56061
  port_billing: 56062
  port_plugin: 56063
grafana:
  url: https://grafana.ops.dify.dev
  # 实际 prometheus datasource ID — 通过 GET /api/datasources 拿
  prom_datasource_id: 5
signoz:
  url: https://signoz.dify.dev
teleport:
  # SRE 把 Teleport 切到 443 单端口模式后，3080 不再可达。
  # 必须显式带 :443，否则 tsh 默认走 3080 会 Connection refused。
  proxy: teleport.dify.dev:443
  user: ''
  auth_home: /opt/zd-agent/.tsh
  warn_threshold_minutes: 30
  check_interval_seconds: 300
  # 同 reason 的飞书推送之间最短间隔（秒）。证书过期后不重复推，1h 一次。
  notify_interval_seconds: 3600
repos:
  base_dir: ''
  repositories:
  - dify
  - dify-billing
  - dify-marketplace-backend
  - dify-marketplace-frontend
  - saas-deploy
  aliases:
    d: dify
    main: dify
    billing: dify-billing
    bill: dify-billing
    mb: dify-marketplace-backend
    marketplace-backend: dify-marketplace-backend
    mf: dify-marketplace-frontend
    marketplace-frontend: dify-marketplace-frontend
    deploy: saas-deploy
