[project]
name = "zd-agent"
version = "0.1.0"
description = "Zendesk 工单自动处理 Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai",
    "httpx[socks]",
    "typer",
    "pydantic>=2.0",
    "pydantic-settings",
    "structlog",
    "apscheduler>=4.0.0a1",
    "pyyaml",
    "rich",
    "tiktoken",
    "python-dotenv",
    "aiohttp",
    "zendesk-cli",
]

[tool.uv.sources]
zendesk-cli = { git = "ssh://git@github.com/ZhouhaoJiang/zendesk-cli.git" }

[project.scripts]
zd-agent = "zd_agent.entry.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zd_agent"]
