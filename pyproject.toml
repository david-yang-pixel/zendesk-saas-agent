[project]
name = "zd-agent"
version = "0.1.0"
description = "Zendesk 工单自动处理 Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai",
    "httpcore>=1.0.9,<1.1",
    "httpx[socks]",
    "typer",
    "pydantic>=2.0",
    "pydantic-settings",
    "structlog",
    "apscheduler>=4.0.0a1",
    "pyyaml",
    "rich",
    "tiktoken",
    "python-dotenv",
    "aiohttp",
    "zendesk-cli",
    "anthropic>=0.87.0",
    "mistune>=3.2.0",
]

[tool.uv.sources]
# 用 HTTPS（公开仓库，容器内无需 SSH key）
zendesk-cli = { git = "https://github.com/ZhouhaoJiang/zendesk-cli.git" }

[project.scripts]
zd-agent = "zd_agent.entry.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1,<2",
    "pytest",
    "pytest-asyncio",
    "ruff>=0.14,<0.15",
]

[tool.ruff.lint]
external = ["ANY", "SIZ"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src/zd_agent/casework", "tests/casework"]
strict = ["src/zd_agent/casework"]
pythonVersion = "3.12"
reportMissingTypeStubs = false

[tool.hatch.build.targets.wheel]
packages = ["src/zd_agent"]
