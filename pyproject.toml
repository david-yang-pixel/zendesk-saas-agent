[project]
name = "zd-agent"
version = "0.1.0"
description = "ZD Agent: Zendesk AI Casework & Support Automation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "docker>=7.1,<8",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pyright>=1.1.404,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "testcontainers[postgres]>=4.10,<5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
  "packages/contracts/src",
  "packages/persistence/src",
  "packages/agent-core/src",
  "packages/tool-sdk/src",
  "apps/ingress/src",
  "apps/harness/src",
  "apps/sandbox/src",
  "apps/admin-api/src",
  ".",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = [
  "packages/contracts/src",
  "packages/persistence/src",
  "packages/agent-core/src",
  "packages/tool-sdk/src",
  "apps/ingress/src",
  "apps/harness/src",
  "apps/sandbox/src",
  "apps/admin-api/src",
  "deploy",
  "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["apps", "deploy/release.py", "packages", "tests"]
exclude = ["apps/admin-web", "**/__pycache__"]
extraPaths = [
  "packages/contracts/src",
  "packages/persistence/src",
  "packages/agent-core/src",
  "packages/tool-sdk/src",
  "apps/ingress/src",
  "apps/harness/src",
  "apps/sandbox/src",
  "apps/admin-api/src",
]
