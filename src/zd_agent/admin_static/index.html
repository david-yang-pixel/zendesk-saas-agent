<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zd-agent 管理后台</title>
  <link rel="stylesheet" href="/admin/static/styles.css">
</head>
<body>
  <div id="login" class="login-wrap">
    <section class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark">zd</div>
        <div>
          <h1>zd-agent 管理后台</h1>
          <p>统一管理 agent 配置、运行记录和审计变更</p>
        </div>
      </div>
      <div class="sso-grid" aria-label="SSO 登录方式">
        <button class="btn sso" onclick="showSsoHint('Google')">使用 Google 登录</button>
        <button class="btn sso" onclick="showSsoHint('飞书')">使用飞书登录</button>
      </div>
      <div class="divider"><span>或使用账号密码</span></div>
      <label for="login-user">账号</label>
      <input id="login-user" value="admin" autocomplete="username">
      <label for="login-pass">密码</label>
      <input id="login-pass" type="password" value="admin123" autocomplete="current-password">
      <p class="login-hint">默认账号 <code>admin</code>，初始密码 <code>admin123</code>。首次进入后需要修改密码。</p>
      <button class="btn primary full" onclick="login()">登录管理后台</button>
      <div id="login-msg" class="form-message danger-text" role="alert"></div>
    </section>
  </div>

  <div id="password-change" class="login-wrap hidden">
    <section class="auth-card">
      <div class="brand-mark">zd</div>
      <h1>修改初始密码</h1>
      <p>当前账号仍在使用默认密码，修改后才能进入管理后台。</p>
      <label for="change-current">当前密码</label>
      <input id="change-current" type="password" autocomplete="current-password">
      <label for="change-new">新密码</label>
      <input id="change-new" type="password" placeholder="至少 8 位" autocomplete="new-password">
      <label for="change-confirm">确认新密码</label>
      <input id="change-confirm" type="password" autocomplete="new-password">
      <div class="button-row">
        <button class="btn primary" onclick="completePasswordChange()">保存新密码</button>
        <button class="btn" onclick="logout()">退出登录</button>
      </div>
      <div id="change-msg" class="form-message danger-text" role="alert"></div>
    </section>
  </div>

  <div id="app" class="shell hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-title">zd-agent</div>
        <div class="sidebar-subtitle">管理后台</div>
      </div>
      <nav id="nav" class="nav" aria-label="主菜单"></nav>
      <div class="sidebar-footer">
        <div>
          <div><span class="status-dot"></span>Agent 健康</div>
          <div id="side-image-tag" class="side-meta">zd-agent:latest</div>
        </div>
        <button class="btn secondary full" onclick="logout()">退出登录</button>
      </div>
    </aside>
    <main class="main">
      <header class="page-header">
        <div>
          <h1 id="page-title">总览</h1>
          <p id="page-subtitle"></p>
        </div>
        <div id="page-actions" class="button-row"></div>
      </header>
      <section id="content" class="content" aria-live="polite"></section>
    </main>
  </div>

  <div id="detail-drawer" class="drawer-backdrop hidden" onclick="closeDrawer()">
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" onclick="event.stopPropagation()">
      <header class="drawer-header">
        <div>
          <h2 id="drawer-title">详情</h2>
          <p id="drawer-subtitle"></p>
        </div>
        <button class="btn secondary" onclick="closeDrawer()">关闭</button>
      </header>
      <div id="drawer-body" class="drawer-body"></div>
    </aside>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden" onclick="closeModal()">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" onclick="event.stopPropagation()">
      <header class="modal-header">
        <h2 id="modal-title">确认</h2>
        <button class="icon-btn" aria-label="关闭" onclick="closeModal()">×</button>
      </header>
      <div id="modal-body" class="modal-body"></div>
      <footer id="modal-actions" class="modal-actions"></footer>
    </section>
  </div>

  <script src="/admin/static/app.js"></script>
</body>
</html>
