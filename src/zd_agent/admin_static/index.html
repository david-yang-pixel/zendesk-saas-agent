<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="zd-agent 管理后台">
  <title>zd-agent 管理后台</title>
  <link rel="stylesheet" href="/admin/static/styles.css">
  <link rel="stylesheet" href="/admin/static/shell.css">
</head>
<body>
  <div id="login" class="login-wrap">
    <main class="auth-shell auth-stage">
      <header class="auth-product">
        <img class="auth-logo" src="/admin/static/dify-logo.svg" width="200" height="89" alt="Dify">
        <div class="auth-product-copy">
          <strong>zd-agent</strong>
          <span>Agent 管理后台</span>
        </div>
        <span class="auth-environment"><span class="status-dot"></span>服务在线</span>
      </header>
      <section class="auth-panel" aria-labelledby="login-title">
        <div class="auth-heading">
          <span class="auth-eyebrow">安全访问</span>
          <h1 id="login-title">登录管理后台</h1>
          <p>使用已启用的登录方式进入 Agent 控制台。</p>
        </div>
        <div class="sso-grid" aria-label="SSO 登录方式">
          <button type="button" class="btn sso google" onclick="showSsoHint('Google')"><span>G</span>使用 Google 登录</button>
          <button type="button" class="btn sso feishu" onclick="showSsoHint('飞书')"><span>飞</span>使用飞书登录</button>
        </div>
        <div class="divider"><span>账号密码</span></div>
        <form id="login-form" class="auth-form" onsubmit="event.preventDefault(); login()">
          <div class="field-stack">
            <label for="login-user">账号</label>
            <input id="login-user" value="admin" autocomplete="username">
          </div>
          <div class="field-stack">
            <label for="login-pass">密码</label>
            <div class="password-input-wrap">
              <input id="login-pass" type="password" autocomplete="current-password">
              <button type="button" class="password-toggle" aria-label="显示密码" onclick="togglePassword('login-pass', this)">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2.1 12s3.6-7 9.9-7 9.9 7 9.9 7-3.6 7-9.9 7-9.9-7-9.9-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <p class="login-hint">默认账号 <code>admin</code>。首次登录后需要修改初始化密码。</p>
          <button type="submit" class="btn primary full">登录管理后台</button>
          <div id="login-msg" class="form-message danger-text" role="alert"></div>
        </form>
      </section>
      <footer class="auth-footer"><span>仅限授权管理员访问</span><span>受保护连接</span></footer>
    </main>
  </div>

  <div id="password-change" class="login-wrap hidden">
    <main class="auth-shell auth-stage">
      <header class="auth-product">
        <img class="auth-logo" src="/admin/static/dify-logo.svg" width="200" height="89" alt="Dify">
        <div class="auth-product-copy">
          <strong>zd-agent</strong>
          <span>Agent 管理后台</span>
        </div>
        <span class="auth-environment"><span class="status-dot"></span>首次登录</span>
      </header>
      <section class="auth-panel" aria-labelledby="password-change-title">
        <div class="auth-heading">
          <span class="auth-eyebrow">账号安全</span>
          <h1 id="password-change-title">修改初始密码</h1>
          <p>设置至少 8 位的新密码后进入管理后台。</p>
        </div>
        <form id="password-change-form" class="auth-form" onsubmit="event.preventDefault(); completePasswordChange()">
          <div class="field-stack">
            <label for="change-current">当前密码</label>
            <input id="change-current" type="password" autocomplete="current-password">
          </div>
          <div class="field-stack">
            <label for="change-new">新密码</label>
            <input id="change-new" type="password" placeholder="至少 8 位" autocomplete="new-password">
          </div>
          <div class="field-stack">
            <label for="change-confirm">确认新密码</label>
            <input id="change-confirm" type="password" autocomplete="new-password">
          </div>
          <div class="button-row">
            <button type="submit" class="btn primary">保存新密码</button>
            <button type="button" class="btn secondary" onclick="logout()">退出登录</button>
          </div>
          <div id="change-msg" class="form-message danger-text" role="alert"></div>
        </form>
      </section>
      <footer class="auth-footer"><span>密码不会以明文保存</span><span>受保护连接</span></footer>
    </main>
  </div>

  <div id="app" class="shell hidden">
    <div id="sidebar-backdrop" class="sidebar-backdrop" onclick="closeSidebar(true)"></div>
    <aside id="sidebar" class="sidebar" aria-label="主导航">
      <div class="sidebar-brand">
        <div class="sidebar-logo-row">
          <img class="sidebar-logo" src="/admin/static/dify-logo.svg" width="200" height="89" alt="Dify">
          <div>
            <div class="sidebar-title">zd-agent</div>
            <div class="sidebar-subtitle">SaaS Support</div>
          </div>
        </div>
        <button type="button" class="icon-btn sidebar-close" aria-label="关闭导航" onclick="closeSidebar(true)">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></svg>
        </button>
      </div>
      <nav id="nav" class="nav" aria-label="主菜单"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-health">
          <span class="status-dot"></span>
          <div><strong>通知服务已连接</strong><span id="side-image-tag" class="side-meta">zd-agent:latest</span></div>
        </div>
        <button type="button" class="btn secondary full sidebar-logout" onclick="logout()">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></svg>
          退出登录
        </button>
      </div>
    </aside>
    <main id="main-content" class="main">
      <header class="page-header">
        <div class="page-context">
          <button id="mobile-nav-toggle" type="button" class="icon-btn mobile-nav-toggle" aria-label="打开导航" aria-controls="sidebar" aria-expanded="false" onclick="toggleSidebar()">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div class="page-heading">
            <span class="page-eyebrow">DIFY SUPPORT OPERATIONS</span>
            <h1 id="page-title" tabindex="-1">总览</h1>
            <p id="page-subtitle"></p>
          </div>
        </div>
        <div class="page-command-bar">
          <div class="live-state"><span class="status-dot"></span><span id="header-live-state">服务正常</span></div>
          <div id="page-actions" class="button-row"></div>
        </div>
      </header>
      <section id="content" class="content" aria-live="polite"></section>
    </main>
  </div>

  <div id="detail-drawer" class="drawer-backdrop hidden" aria-hidden="true" onclick="closeDrawer()">
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" onclick="event.stopPropagation()">
      <header class="drawer-header">
        <div>
          <h2 id="drawer-title">详情</h2>
          <p id="drawer-subtitle"></p>
        </div>
        <button type="button" class="icon-btn" aria-label="关闭详情" onclick="closeDrawer()"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></svg></button>
      </header>
      <div id="drawer-body" class="drawer-body"></div>
    </aside>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden" aria-hidden="true" onclick="closeModal()">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" onclick="event.stopPropagation()">
      <header class="modal-header">
        <h2 id="modal-title">确认</h2>
        <button type="button" class="icon-btn" aria-label="关闭" onclick="closeModal()"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></svg></button>
      </header>
      <div id="modal-body" class="modal-body"></div>
      <footer id="modal-actions" class="modal-actions"></footer>
    </section>
  </div>

  <script src="/admin/static/app.js"></script>
</body>
</html>
