name: casework-greenfield

x-image-build: &image-build
  context: ..
  dockerfile: deploy/Dockerfile

x-common-environment: &common-environment
  DATABASE_URL: postgresql+asyncpg://casework:casework@postgres:5432/casework
  CASEWORK_CONFIG_REVISION: ${CASEWORK_CONFIG_REVISION:-dev}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: casework
      POSTGRES_USER: casework
      POSTGRES_PASSWORD: casework
    volumes:
      - casework-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casework -d casework"]
      interval: 5s
      timeout: 3s
      retries: 20

  migration:
    image: casework-admin:dev
    build:
      <<: *image-build
      target: admin
    command: ["/app/.venv/bin/python", "/app/deploy/migrate.py"]
    environment:
      <<: *common-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ingress:
    image: casework-ingress:dev
    build:
      <<: *image-build
      target: ingress
    environment:
      <<: *common-environment
    ports:
      - "8101:8101"
    depends_on:
      migration:
        condition: service_completed_successfully

  pi-agent:
    image: casework-pi-agent:dev
    build:
      <<: *image-build
      target: pi-agent
    environment:
      <<: *common-environment
      ZENDESK_BASE_URL: ${ZENDESK_BASE_URL:-https://example.invalid}
      ZENDESK_EMAIL: ${ZENDESK_EMAIL:-unconfigured@example.invalid}
      ZENDESK_API_TOKEN: ${ZENDESK_API_TOKEN:-unconfigured}
      CASEWORK_OPENCONNECTOR_MCP_URL: ${CASEWORK_OPENCONNECTOR_MCP_URL:-https://example.invalid/mcp}
      CASEWORK_CREDENTIAL_OPENCONNECTOR_RUNTIME: ${OPENCONNECTOR_RUNTIME_TOKEN:-}
      CASEWORK_BROWSER_RELAY_URL: ${CASEWORK_BROWSER_RELAY_URL:-https://example.invalid/relay}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
    ports:
      - "8102:8102"
    depends_on:
      migration:
        condition: service_completed_successfully

  admin:
    image: casework-admin:dev
    build:
      <<: *image-build
      target: admin
    environment:
      <<: *common-environment
      ADMIN_API_BASE_URL: http://admin:8104
      CASEWORK_CREDENTIAL_FILE: /run/casework-credentials/credentials.env
    ports:
      - "8104:8104"
    volumes:
      - ${CASEWORK_CREDENTIAL_DIR:-./credentials}:/run/casework-credentials
    depends_on:
      migration:
        condition: service_completed_successfully

volumes:
  casework-postgres:
