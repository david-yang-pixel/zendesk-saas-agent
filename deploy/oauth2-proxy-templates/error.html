<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zd-agent 工单日志 · 出错</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font: 15px/1.5 -apple-system, system-ui, "PingFang SC", sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #25253f 100%);
      color: #1a1a2e;
    }
    .card {
      background: #fff; width: 380px; max-width: 90vw;
      border-radius: 14px; padding: 40px 36px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35); text-align: center;
    }
    .logo {
      width: 52px; height: 52px; margin: 0 auto 18px; border-radius: 12px;
      background: #c0392b; display: flex; align-items: center;
      justify-content: center; font-size: 26px;
    }
    h1 { font-size: 19px; font-weight: 600; }
    .code { margin-top: 8px; font-size: 13px; color: #8a8a9a; }
    .msg {
      margin-top: 16px; padding: 12px; border-radius: 8px;
      background: #fdecea; color: #c0392b; font-size: 13px;
      word-break: break-word;
    }
    .btn {
      display: inline-block; margin-top: 24px; padding: 10px 24px;
      background: #3b5bdb; color: #fff; border-radius: 9px;
      text-decoration: none; font-size: 14px; font-weight: 500;
    }
    .btn:hover { background: #2f49b3; }
    .foot { margin-top: 20px; font-size: 12px; color: #b0b0bd; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">⚠️</div>
    <h1>登录出错</h1>
    {{ if .StatusCode }}<div class="code">错误码 {{ .StatusCode }}</div>{{ end }}
    {{ if .Message }}<div class="msg">{{ .Message }}</div>{{ end }}
    <a class="btn" href="{{.ProxyPrefix}}/sign_in">返回登录</a>
    <div class="foot">仅限 <b>@dify.ai</b> 企业邮箱可访问 zd-agent 工单日志</div>
  </div>
</body>
</html>
