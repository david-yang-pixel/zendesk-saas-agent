# HTTP → HTTPS redirect + ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name <agent-public-domain>;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS reverse proxy to 127.0.0.1:8080 (zd-agent container)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <agent-public-domain>;

    ssl_certificate     /etc/letsencrypt/live/<agent-public-domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<agent-public-domain>/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 10m;

    # Webhook endpoints (Zendesk)
    location /webhook/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    # /internal/* 不对外暴露
    location /internal/ {
        return 404;
    }

    # Deny everything else
    location / {
        return 404;
    }
}
