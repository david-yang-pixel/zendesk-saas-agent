# HTTP → HTTPS redirect + ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name zd-agent.smlershou.top;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS reverse proxy to 127.0.0.1:8080 (zd-agent container)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zd-agent.smlershou.top;

    ssl_certificate     /etc/letsencrypt/live/zd-agent.smlershou.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zd-agent.smlershou.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 10m;

    # Webhook endpoints (Zendesk + Feishu)
    location /webhook/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check (optional — implement GET /healthz in the aiohttp app)
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    # Deny everything else
    location / {
        return 404;
    }
}
