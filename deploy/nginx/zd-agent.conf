# HTTP → HTTPS redirect + ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name zendesk.smlershou.top;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS reverse proxy to 127.0.0.1:8080 (zd-agent container)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zendesk.smlershou.top;

    ssl_certificate     /etc/letsencrypt/live/zendesk.smlershou.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zendesk.smlershou.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 10m;

    # Webhook endpoints (Zendesk)
    location /webhook/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Teleport auth web relay (human-facing password+OTP form)
    # - GET /teleport-auth?t=<token> → HTML form
    # - POST /teleport-auth           → runs tsh login with pexpect (~20s)
    location = /teleport-auth {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # pexpect tsh login 可能需要 60 秒+（含 teleport 服务器往返）
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Health check
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    # ───── 工单日志 Web 界面（log-viewer 8081）+ Google 登录（oauth2-proxy 4180）─────
    # oauth2-proxy 端点（sign_in / callback / auth 子请求）
    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host                    $host;
        proxy_set_header X-Real-IP               $remote_addr;
        proxy_set_header X-Scheme                $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }
    location = /oauth2/auth {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Scheme         $scheme;
        proxy_set_header Content-Length   "";
        proxy_pass_request_body           off;
    }
    # log-viewer：先经 oauth2-proxy 认证（未登录 → 跳 Google，限 @dify.ai）
    location /logs/ {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /internal/* 是仅供同机 watchdog 调用的内部接口，Nginx 不对外暴露
    location /internal/ {
        return 404;
    }

    # Deny everything else
    location / {
        return 404;
    }
}
