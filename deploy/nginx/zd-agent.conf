# HTTP → HTTPS redirect + ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name zendesk.smlershou.top;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS reverse proxy to 127.0.0.1:8080 (zd-agent container)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zendesk.smlershou.top;

    ssl_certificate     /etc/letsencrypt/live/zendesk.smlershou.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zendesk.smlershou.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 10m;

    # Webhook endpoints (Zendesk)
    location /webhook/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Teleport auth web relay (human-facing password+OTP form)
    # - GET /teleport-auth?t=<token> → HTML form
    # - POST /teleport-auth           → runs tsh login with pexpect (~20s)
    location = /teleport-auth {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # pexpect tsh login 可能需要 60 秒+（含 teleport 服务器往返）
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Health check
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    # 工单日志 Web 界面（log-viewer，独立服务 8081）
    # ⚠️ Phase 4 暂无认证 —— Phase 5 会在此叠 oauth2-proxy（Google 登录限 @dify.ai）。
    # 日志含客户 PII，不可长期裸奔。
    location /logs/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /internal/* 是仅供同机 watchdog 调用的内部接口，Nginx 不对外暴露
    location /internal/ {
        return 404;
    }

    # Deny everything else
    location / {
        return 404;
    }
}
