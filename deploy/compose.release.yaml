name: casework-greenfield

services:
  postgres:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: casework
      POSTGRES_USER: casework
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - casework-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casework -d casework"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.35

  migration:
    image: ${CASEWORK_HARNESS_IMAGE:?render a release manifest first}
    command: ["/app/.venv/bin/python", "/app/deploy/migrate.py"]
    environment: &common-environment
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      CASEWORK_CONFIG_REVISION: ${CASEWORK_CONFIG_REVISION:?set CASEWORK_CONFIG_REVISION}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ingress:
    image: ${CASEWORK_INGRESS_IMAGE:?render a release manifest first}
    environment:
      <<: *common-environment
      ZENDESK_BASE_URL: ${ZENDESK_BASE_URL:?set ZENDESK_BASE_URL}
      ZENDESK_EMAIL: ${ZENDESK_EMAIL:?set ZENDESK_EMAIL}
      ZENDESK_API_TOKEN: ${ZENDESK_API_TOKEN:?set ZENDESK_API_TOKEN}
      ZENDESK_MESSAGING_WEBHOOK_SECRET: ${ZENDESK_MESSAGING_WEBHOOK_SECRET:?set ZENDESK_MESSAGING_WEBHOOK_SECRET}
    ports: ["127.0.0.1:${CASEWORK_INGRESS_PORT:-18101}:8101"]
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25

  harness:
    image: ${CASEWORK_HARNESS_IMAGE:?render a release manifest first}
    environment:
      <<: *common-environment
      SANDBOX_IMAGE: ${CASEWORK_SANDBOX_IMAGE:?render a release manifest first}
      ZENDESK_BASE_URL: ${ZENDESK_BASE_URL:?set ZENDESK_BASE_URL}
      ZENDESK_EMAIL: ${ZENDESK_EMAIL:?set ZENDESK_EMAIL}
      ZENDESK_API_TOKEN: ${ZENDESK_API_TOKEN:?set ZENDESK_API_TOKEN}
      CASEWORK_MODEL_BASE_URL: ${CASEWORK_MODEL_BASE_URL:?set CASEWORK_MODEL_BASE_URL}
      CASEWORK_TOOL_CONFIG: ${CASEWORK_TOOL_CONFIG:?set CASEWORK_TOOL_CONFIG}
      CASEWORK_CREDENTIAL_FILE: /run/casework-credentials/credentials.env
      CASEWORK_DELIVERY_MODE: ${CASEWORK_DELIVERY_MODE:-dry_run}
      CASEWORK_CANARY_TICKET_IDS: ${CASEWORK_CANARY_TICKET_IDS:-}
      CASEWORK_BROWSER_RELAY_URL: ${CASEWORK_BROWSER_RELAY_URL:-}
      CASEWORK_BROWSER_RELAY_API_KEY: ${CASEWORK_BROWSER_RELAY_API_KEY:-}
    ports: ["127.0.0.1:${CASEWORK_HARNESS_PORT:-18102}:8102"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CASEWORK_CREDENTIAL_DIR:?set CASEWORK_CREDENTIAL_DIR}:/run/casework-credentials:ro
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID to the docker.sock group id}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.35

  admin:
    image: ${CASEWORK_ADMIN_IMAGE:?render a release manifest first}
    environment:
      <<: *common-environment
      CASEWORK_TOOL_PROBE_ENDPOINTS: ${CASEWORK_TOOL_PROBE_ENDPOINTS:-}
      CASEWORK_MODEL_BASE_URL: ${CASEWORK_MODEL_BASE_URL:?set CASEWORK_MODEL_BASE_URL}
      CASEWORK_CREDENTIAL_FILE: /run/casework-credentials/credentials.env
      CASEWORK_ADMIN_AUTH_FILE: ${CASEWORK_ADMIN_AUTH_FILE:?set CASEWORK_ADMIN_AUTH_FILE}
      CASEWORK_ADMIN_INTERNAL_TOKEN_FILE: ${CASEWORK_ADMIN_INTERNAL_TOKEN_FILE:?set CASEWORK_ADMIN_INTERNAL_TOKEN_FILE}
      CASEWORK_ADMIN_PUBLIC_ORIGIN: ${CASEWORK_ADMIN_PUBLIC_ORIGIN:?set CASEWORK_ADMIN_PUBLIC_ORIGIN}
    ports: ["127.0.0.1:${CASEWORK_ADMIN_PORT:-18104}:8104"]
    volumes:
      - ${CASEWORK_CREDENTIAL_DIR:?set CASEWORK_CREDENTIAL_DIR}:/run/casework-credentials
      - ${CASEWORK_ADMIN_AUTH_DIR:?set CASEWORK_ADMIN_AUTH_DIR}:/run/casework-admin-auth
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25

volumes:
  casework-postgres:
