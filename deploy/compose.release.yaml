name: casework-greenfield

services:
  postgres:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: casework
      POSTGRES_USER: casework
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - casework-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casework -d casework"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.35

  migration:
    image: ${CASEWORK_ADMIN_IMAGE:-ghcr.io/david-yang-pixel/zendesk-saas-agent-casework-admin:latest}
    command: ["/app/.venv/bin/python", "/app/deploy/migrate.py"]
    environment: &common-environment
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      CASEWORK_CONFIG_REVISION: ${CASEWORK_CONFIG_REVISION:?set CASEWORK_CONFIG_REVISION}
      PYTHONPATH: /app/apps/admin-api/src:/app/apps/ingress/src:/app/packages/contracts/src:/app/packages/persistence/src
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ingress:
    image: ${CASEWORK_INGRESS_IMAGE:?render a release manifest first}
    environment:
      <<: *common-environment
      ZENDESK_BASE_URL: ${ZENDESK_BASE_URL:?set ZENDESK_BASE_URL}
      ZENDESK_EMAIL: ${ZENDESK_EMAIL:?set ZENDESK_EMAIL}
      ZENDESK_API_TOKEN: ${ZENDESK_API_TOKEN:?set ZENDESK_API_TOKEN}
      ZENDESK_MESSAGING_WEBHOOK_SECRET: ${ZENDESK_MESSAGING_WEBHOOK_SECRET:?set ZENDESK_MESSAGING_WEBHOOK_SECRET}
      ZENDESK_TICKET_EVENTS_WEBHOOK_SECRET: ${ZENDESK_TICKET_EVENTS_WEBHOOK_SECRET:-}
    ports: ["127.0.0.1:${CASEWORK_INGRESS_PORT:-18101}:8101"]
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25

  pi-agent:
    image: ${CASEWORK_PI_AGENT_IMAGE:-pi-agent:v1}
    environment:
      <<: *common-environment
      CASEWORK_MODEL_BASE_URL: ${CASEWORK_MODEL_BASE_URL:-https://api.tokener.dev/v1}
      CASEWORK_MODEL_NAME: ${CASEWORK_MODEL_NAME:-gpt-5.6-terra}
      CASEWORK_OPENCONNECTOR_MCP_URL: ${CASEWORK_OPENCONNECTOR_MCP_URL:-https://open-connector.yyg066340.workers.dev/mcp}
      CASEWORK_BROWSER_RELAY_URL: ${CASEWORK_BROWSER_RELAY_URL:-https://zendesk.smlershou.top/zendesk-browser-relay}
      CASEWORK_BROWSER_RELAY_API_KEY: ${CASEWORK_BROWSER_RELAY_API_KEY:-}
      ZENDESK_BASE_URL: ${ZENDESK_BASE_URL:?set ZENDESK_BASE_URL}
      ZENDESK_EMAIL: ${ZENDESK_EMAIL:?set ZENDESK_EMAIL}
      ZENDESK_API_TOKEN: ${ZENDESK_API_TOKEN:?set ZENDESK_API_TOKEN}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-https://open.feishu.cn/open-apis/bot/v2/hook/a45917d4-4ca4-4aa8-bf70-a267c8e41de0}
      NODE_OPTIONS: "--max-old-space-size=768"
      CASEWORK_WORKER_CONCURRENCY: ${CASEWORK_WORKER_CONCURRENCY:-2}
    ports: ["127.0.0.1:${CASEWORK_PI_AGENT_PORT:-18102}:8102"]
    volumes:
      - ${CASEWORK_CREDENTIAL_DIR:?set CASEWORK_CREDENTIAL_DIR}/credentials.env:/app/credentials.env:ro
    group_add:
      - "${DOCKER_GID:-0}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 0.5

  admin:
    image: ${CASEWORK_ADMIN_IMAGE:?render a release manifest first}
    environment:
      <<: *common-environment
      CASEWORK_TOOL_PROBE_ENDPOINTS: ${CASEWORK_TOOL_PROBE_ENDPOINTS:-}
      CASEWORK_MODEL_BASE_URL: ${CASEWORK_MODEL_BASE_URL:?set CASEWORK_MODEL_BASE_URL}
      CASEWORK_OPENCONNECTOR_MCP_URL: ${CASEWORK_OPENCONNECTOR_MCP_URL:-https://open-connector.yyg066340.workers.dev/mcp}
      CASEWORK_CREDENTIAL_FILE: /run/casework-credentials/credentials.env
      CASEWORK_ADMIN_AUTH_FILE: ${CASEWORK_ADMIN_AUTH_FILE:?set CASEWORK_ADMIN_AUTH_FILE}
      CASEWORK_ADMIN_INTERNAL_TOKEN_FILE: ${CASEWORK_ADMIN_INTERNAL_TOKEN_FILE:?set CASEWORK_ADMIN_INTERNAL_TOKEN_FILE}
      CASEWORK_ADMIN_PUBLIC_ORIGIN: ${CASEWORK_ADMIN_PUBLIC_ORIGIN:?set CASEWORK_ADMIN_PUBLIC_ORIGIN}
      ADMIN_WEB_DIST: ${ADMIN_WEB_DIST:-/app/apps/admin-web/dist}
    ports: ["127.0.0.1:${CASEWORK_ADMIN_PORT:-18104}:8104"]
    volumes:
      - ${CASEWORK_CREDENTIAL_DIR:?set CASEWORK_CREDENTIAL_DIR}:/run/casework-credentials
      - ${CASEWORK_ADMIN_AUTH_DIR:?set CASEWORK_ADMIN_AUTH_DIR}:/run/casework-admin-auth
      - /opt/zd-agent/code/apps/admin-web/dist:/app/apps/admin-web/dist:ro
      - /opt/zd-agent/code/apps/admin-api/src/casework_admin/api_v2.py:/app/apps/admin-api/src/casework_admin/api_v2.py:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25

  log-sync:
    profiles: [log-sync]
    image: ${CASEWORK_ADMIN_IMAGE:?render a release manifest first}
    user: "10001:10001"
    command:
      - /app/.venv/bin/python
      - /app/deploy/sync_run_logs.py
      - --mode
      - watch
      - --credentials-file
      - /run/log-sync/credentials.json
    environment:
      <<: *common-environment
    volumes:
      - ${CASEWORK_LOG_SYNC_CREDENTIAL_DIR:-/opt/zd-agent/greenfield/log-sync}:/run/log-sync:ro
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.10

volumes:
  casework-postgres:
