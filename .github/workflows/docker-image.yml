name: Build and release ZD Agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the digest-pinned image bundle to production
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zd-agent-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}-casework

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python dependencies
        run: uv sync --frozen --dev
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run pyright
      - name: Python tests
        run: uv run pytest -q
      - name: Enable Corepack
        run: corepack enable
      - name: Install Admin dependencies
        run: pnpm install --frozen-lockfile
      - name: Test Admin console
        run: pnpm --dir apps/admin-web test
      - name: Build Admin console
        run: pnpm --dir apps/admin-web build
      - name: Test and build Pi Agent
        run: |
          pnpm --filter pi-agent test
          pnpm --filter pi-agent build

  build:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ingress_digest: ${{ steps.ingress.outputs.digest }}
      admin_digest: ${{ steps.admin.outputs.digest }}
      pi_agent_digest: ${{ steps.pi_agent.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Ingress
        id: ingress
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ingress
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-ingress:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-ingress:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and push Admin
        id: admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: admin
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-admin:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-admin:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and push Pi Agent
        id: pi_agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: pi-agent
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-pi-agent:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-pi-agent:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy digest-pinned Greenfield bundle
        env:
          DEPLOY_HOST: ${{ secrets.ZD_AGENT_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ZD_AGENT_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ZD_AGENT_DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.ZD_AGENT_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ZD_AGENT_DEPLOY_KNOWN_HOSTS }}
          OPENCONNECTOR_RUNTIME_TOKEN: ${{ secrets.OPENCONNECTOR_RUNTIME_TOKEN }}
          CASEWORK_OPENCONNECTOR_MCP_URL: ${{ vars.CASEWORK_OPENCONNECTOR_MCP_URL }}
          ZENDESK_TICKET_EVENTS_WEBHOOK_SECRET: ${{ secrets.ZENDESK_TICKET_EVENTS_WEBHOOK_SECRET }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          HC_CLIENT_URL: ${{ vars.HC_CLIENT_URL }}
          HC_CLIENT_API_KEY: ${{ secrets.HC_CLIENT_API_KEY }}
          CASEWORK_LOG_SYNC_ENABLED: ${{ vars.CASEWORK_LOG_SYNC_ENABLED }}
          CASEWORK_REUSE_TOOL_CONFIG: ${{ vars.CASEWORK_REUSE_TOOL_CONFIG }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
          INGRESS_DIGEST: ${{ needs.build.outputs.ingress_digest }}
          ADMIN_DIGEST: ${{ needs.build.outputs.admin_digest }}
          PI_AGENT_DIGEST: ${{ needs.build.outputs.pi_agent_digest }}
        run: |
          set -euo pipefail
          required=(DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS OPENCONNECTOR_RUNTIME_TOKEN GHCR_PAT INGRESS_DIGEST ADMIN_DIGEST PI_AGENT_DIGEST)
          for name in "${required[@]}"; do
            test -n "${!name:-}" || { echo "Missing required deployment input: ${name}" >&2; exit 1; }
          done
          if [[ "${CASEWORK_LOG_SYNC_ENABLED:-false}" == "true" ]]; then
            for name in HC_CLIENT_URL HC_CLIENT_API_KEY; do
              test -n "${!name:-}" || { echo "Missing required log-sync input: ${name}" >&2; exit 1; }
            done
          fi
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          install -d -m 700 ~/.ssh
          key_file=~/.ssh/casework_deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          {
            printf 'export GHCR_USERNAME=%q\n' "$GHCR_USERNAME"
            printf 'export GHCR_PAT=%q\n' "$GHCR_PAT"
            printf 'export OPENCONNECTOR_RUNTIME_TOKEN=%q\n' "$OPENCONNECTOR_RUNTIME_TOKEN"
            printf 'export CASEWORK_OPENCONNECTOR_MCP_URL=%q\n' "$CASEWORK_OPENCONNECTOR_MCP_URL"
            printf 'export ZENDESK_TICKET_EVENTS_WEBHOOK_SECRET=%q\n' "$ZENDESK_TICKET_EVENTS_WEBHOOK_SECRET"
            # Optional rotation input. An exported empty value would override
            # the URL already saved in runtime.env, so export only when set.
            if [[ -n "${FEISHU_WEBHOOK_URL:-}" ]]; then
              printf 'export FEISHU_WEBHOOK_URL=%q\n' "$FEISHU_WEBHOOK_URL"
            fi
            printf 'export HC_CLIENT_URL=%q\n' "$HC_CLIENT_URL"
            printf 'export HC_CLIENT_API_KEY=%q\n' "$HC_CLIENT_API_KEY"
            printf 'export CASEWORK_LOG_SYNC_ENABLED=%q\n' "${CASEWORK_LOG_SYNC_ENABLED:-false}"
            printf 'export CASEWORK_REUSE_TOOL_CONFIG=%q\n' "${CASEWORK_REUSE_TOOL_CONFIG:-false}"
            printf 'export CASEWORK_INGRESS_IMAGE=%q\n' "${IMAGE_PREFIX}-ingress@${INGRESS_DIGEST}"
            printf 'export CASEWORK_ADMIN_IMAGE=%q\n' "${IMAGE_PREFIX}-admin@${ADMIN_DIGEST}"
            printf 'export CASEWORK_PI_AGENT_IMAGE=%q\n' "${IMAGE_PREFIX}-pi-agent@${PI_AGENT_DIGEST}"
            printf 'export CASEWORK_RELEASE_REVISION=%q\n' "$GITHUB_SHA"
            cat <<'REMOTE'
          set -euo pipefail
          umask 077
          cd /opt/zd-agent/code
          exec 9>/run/lock/zd-agent-deploy.lock
          flock -w 120 9
          git diff --quiet -- && git diff --cached --quiet -- || {
            echo "Refusing deployment from a dirty tracked worktree" >&2
            exit 1
          }
          git fetch origin main
          git switch main
          git merge --ff-only "$CASEWORK_RELEASE_REVISION"
          test "$(git rev-parse HEAD)" = "$CASEWORK_RELEASE_REVISION"
          export CASEWORK_DEPLOY_LOCK_HELD=1
          ./deploy/deploy-production.sh
          REMOTE
          } | ssh -i "$key_file" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -se

  tag-deployment:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the deployed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One immutable tag per production deploy. The short SHA keeps
          # several deploys on the same (Beijing) day from colliding.
          tag="deploy-$(TZ=Asia/Shanghai date +%Y-%m-%d)-${GITHUB_SHA::7}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists (re-run of the same deploy)"
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" -f sha="${GITHUB_SHA}" >/dev/null
          fi
          echo "Deployed commit tagged \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"

  notify-success:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Send deployment success email
        env:
          SMTP_HOST: ${{ secrets.DEPLOY_NOTIFY_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.DEPLOY_NOTIFY_SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.DEPLOY_NOTIFY_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.DEPLOY_NOTIFY_SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.DEPLOY_NOTIFY_EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.DEPLOY_NOTIFY_EMAIL_TO }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          required = [
              "SMTP_HOST",
              "SMTP_PORT",
              "SMTP_USERNAME",
              "SMTP_PASSWORD",
              "EMAIL_FROM",
              "EMAIL_TO",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              print("Missing required email notification secrets, skipping: " + ", ".join(missing))
              exit(0)

          smtp_host = os.environ["SMTP_HOST"]
          smtp_port = int(os.environ["SMTP_PORT"])
          smtp_username = os.environ["SMTP_USERNAME"]
          smtp_password = os.environ["SMTP_PASSWORD"]
          email_from = os.environ["EMAIL_FROM"]
          email_to = os.environ["EMAIL_TO"]
          repository = os.environ["REPOSITORY"]
          sha = os.environ["SHA"]
          short_sha = sha[:7]
          run_url = f"{os.environ['SERVER_URL']}/{repository}/actions/runs/{os.environ['RUN_ID']}"

          msg = EmailMessage()
          msg["Subject"] = f"zd-agent deployed successfully: {short_sha}"
          msg["From"] = email_from
          msg["To"] = email_to
          msg.set_content(
              "\n".join(
                  [
                      "zd-agent production deployment completed successfully.",
                      "",
                      f"Repository: {repository}",
                      f"Commit: {sha}",
                      f"Workflow run: {run_url}",
                  ]
              )
          )

          try:
              context = ssl.create_default_context()
              if smtp_port == 465:
                  with smtplib.SMTP_SSL(smtp_host, smtp_port, context=context) as server:
                      server.login(smtp_username, smtp_password)
                      server.send_message(msg)
              else:
                  with smtplib.SMTP(smtp_host, smtp_port) as server:
                      server.starttls(context=context)
                      server.login(smtp_username, smtp_password)
                      server.send_message(msg)
              print("Deployment notification email sent successfully!")
          except Exception as e:
              print(f"Failed to send email notification: {e}")
          PY
