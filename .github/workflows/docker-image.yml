name: Build and deploy zd-agent image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/yang-dify/zendesk-saas-agent

concurrency:
  group: zd-agent-production
  cancel-in-progress: true

jobs:
  quality:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.7"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --dev

      - name: Check source quality
        run: uv run ruff check src

      - name: Run test suite
        run: uv run pytest -q

  build:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: production
    timeout-minutes: 10

    steps:
      - name: Deploy on server
        env:
          DEPLOY_HOST: ${{ secrets.ZD_AGENT_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ZD_AGENT_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ZD_AGENT_DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.ZD_AGENT_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ZD_AGENT_DEPLOY_KNOWN_HOSTS }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          missing=()
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required deployment secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_TAG="sha-${GITHUB_SHA}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          key_file=~/.ssh/zd_agent_deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          {
            printf 'export GHCR_USERNAME=%q\n' "$GHCR_USERNAME"
            printf 'export GHCR_PAT=%q\n' "$GHCR_PAT"
            cat <<'REMOTE'
          set -euo pipefail
          cd /opt/zd-agent/code
          for attempt in 1 2 3; do
            if timeout 30s git fetch origin main; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "git fetch failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "git fetch attempt ${attempt} failed; retrying" >&2
            sleep $((attempt * 5))
          done
          git switch main
          git merge --ff-only origin/main
          ./deploy/deploy-ghcr.sh "$DEPLOY_TAG"
          REMOTE
          } | ssh -i "$key_file" -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_TAG='$DEPLOY_TAG' bash -se"

  notify-success:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Send deployment success email
        env:
          SMTP_HOST: ${{ secrets.DEPLOY_NOTIFY_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.DEPLOY_NOTIFY_SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.DEPLOY_NOTIFY_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.DEPLOY_NOTIFY_SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.DEPLOY_NOTIFY_EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.DEPLOY_NOTIFY_EMAIL_TO }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          required = [
              "SMTP_HOST",
              "SMTP_PORT",
              "SMTP_USERNAME",
              "SMTP_PASSWORD",
              "EMAIL_FROM",
              "EMAIL_TO",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              print(
                  "::notice::Skipping deployment success email; missing mail "
                  "notification secrets: " + ", ".join(missing)
              )
              raise SystemExit(0)

          smtp_host = os.environ["SMTP_HOST"]
          smtp_port = int(os.environ["SMTP_PORT"])
          smtp_username = os.environ["SMTP_USERNAME"]
          smtp_password = os.environ["SMTP_PASSWORD"]
          email_from = os.environ["EMAIL_FROM"]
          email_to = os.environ["EMAIL_TO"]
          repository = os.environ["REPOSITORY"]
          sha = os.environ["SHA"]
          short_sha = sha[:7]
          image_name = os.environ["IMAGE_NAME"]
          run_url = f"{os.environ['SERVER_URL']}/{repository}/actions/runs/{os.environ['RUN_ID']}"

          msg = EmailMessage()
          msg["Subject"] = f"zd-agent 部署成功：{short_sha}"
          msg["From"] = email_from
          msg["To"] = email_to
          msg.set_content(
              "\n".join(
                  [
                      "zd-agent 生产环境部署已成功完成。",
                      "",
                      f"仓库：{repository}",
                      f"提交：{sha}",
                      f"已部署镜像：{image_name}:sha-{sha}",
                      f"同步更新标签：{image_name}:main",
                      f"工作流运行：{run_url}",
                  ]
              )
          )

          context = ssl.create_default_context()
          if smtp_port == 465:
              with smtplib.SMTP_SSL(smtp_host, smtp_port, context=context) as server:
                  server.login(smtp_username, smtp_password)
                  server.send_message(msg)
          else:
              with smtplib.SMTP(smtp_host, smtp_port) as server:
                  server.starttls(context=context)
                  server.login(smtp_username, smtp_password)
                  server.send_message(msg)
          PY
