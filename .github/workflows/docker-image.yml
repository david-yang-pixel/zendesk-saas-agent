name: Build and release ZD Agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the digest-pinned four-image bundle to production
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zd-agent-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}-casework

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python dependencies
        run: uv sync --frozen --dev
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run pyright
      - name: Python tests
        run: uv run pytest -q
      - name: Enable Corepack
        run: corepack enable
      - name: Install Admin dependencies
        run: pnpm install --frozen-lockfile
      - name: Test Admin console
        run: pnpm --dir apps/admin-web test
      - name: Build Admin console
        run: pnpm --dir apps/admin-web build
      - name: Test and build Pi Agent
        run: |
          pnpm --filter pi-agent test
          pnpm --filter pi-agent build

  build:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ingress_digest: ${{ steps.ingress.outputs.digest }}
      harness_digest: ${{ steps.harness.outputs.digest }}
      sandbox_digest: ${{ steps.sandbox.outputs.digest }}
      admin_digest: ${{ steps.admin.outputs.digest }}
      pi_agent_digest: ${{ steps.pi_agent.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Ingress
        id: ingress
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ingress
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-ingress:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-ingress:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and push Harness
        id: harness
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: harness
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-harness:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-harness:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and push Sandbox
        id: sandbox
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: sandbox
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-sandbox:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-sandbox:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and push Admin
        id: admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: admin
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-admin:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-admin:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and push Pi Agent
        id: pi_agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: pi-agent
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-pi-agent:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-pi-agent:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy digest-pinned Greenfield bundle
        env:
          DEPLOY_HOST: ${{ secrets.ZD_AGENT_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ZD_AGENT_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ZD_AGENT_DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.ZD_AGENT_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ZD_AGENT_DEPLOY_KNOWN_HOSTS }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
          INGRESS_DIGEST: ${{ needs.build.outputs.ingress_digest }}
          HARNESS_DIGEST: ${{ needs.build.outputs.harness_digest }}
          SANDBOX_DIGEST: ${{ needs.build.outputs.sandbox_digest }}
          ADMIN_DIGEST: ${{ needs.build.outputs.admin_digest }}
          PI_AGENT_DIGEST: ${{ needs.build.outputs.pi_agent_digest }}
        run: |
          set -euo pipefail
          required=(DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS GHCR_PAT INGRESS_DIGEST HARNESS_DIGEST SANDBOX_DIGEST ADMIN_DIGEST PI_AGENT_DIGEST)
          for name in "${required[@]}"; do
            test -n "${!name:-}" || { echo "Missing required deployment input: ${name}" >&2; exit 1; }
          done
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          install -d -m 700 ~/.ssh
          key_file=~/.ssh/casework_deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          {
            printf 'export GHCR_USERNAME=%q\n' "$GHCR_USERNAME"
            printf 'export GHCR_PAT=%q\n' "$GHCR_PAT"
            printf 'export CASEWORK_INGRESS_IMAGE=%q\n' "${IMAGE_PREFIX}-ingress@${INGRESS_DIGEST}"
            printf 'export CASEWORK_HARNESS_IMAGE=%q\n' "${IMAGE_PREFIX}-harness@${HARNESS_DIGEST}"
            printf 'export CASEWORK_SANDBOX_IMAGE=%q\n' "${IMAGE_PREFIX}-sandbox@${SANDBOX_DIGEST}"
            printf 'export CASEWORK_ADMIN_IMAGE=%q\n' "${IMAGE_PREFIX}-admin@${ADMIN_DIGEST}"
            printf 'export CASEWORK_PI_AGENT_IMAGE=%q\n' "${IMAGE_PREFIX}-pi-agent@${PI_AGENT_DIGEST}"
            printf 'export CASEWORK_RELEASE_REVISION=%q\n' "$GITHUB_SHA"
            cat <<'REMOTE'
          set -euo pipefail
          umask 077
          cd /opt/zd-agent/code
          exec 9>/run/lock/zd-agent-deploy.lock
          flock -w 120 9
          git diff --quiet -- && git diff --cached --quiet -- || {
            echo "Refusing deployment from a dirty tracked worktree" >&2
            exit 1
          }
          git fetch origin main
          git switch main
          git merge --ff-only "$CASEWORK_RELEASE_REVISION"
          test "$(git rev-parse HEAD)" = "$CASEWORK_RELEASE_REVISION"
          export CASEWORK_DEPLOY_LOCK_HELD=1
          ./deploy/deploy-production.sh
          REMOTE
          } | ssh -i "$key_file" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -se

  notify-success:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    steps:
      - run: echo "Casework Greenfield digest-pinned production bundle deployed successfully."
